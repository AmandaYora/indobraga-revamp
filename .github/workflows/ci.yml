name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run format -w @indobraga/web
      # Testing ditangguhkan (ADR-0011, keputusan owner 2026-09-27): npm run test:web
      - run: npm run build:web

  contract:
    name: Contract (bundle, lint, mapping, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:content -w @indobraga/api-contract --if-present
      - run: npm run build -w @indobraga/api-contract
      - name: Artefak kontrak ter-commit & mutakhir
        run: git diff --exit-code -- packages/api-contract

  api:
    name: API (vet, lint, build, vuln, sqlc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: apps/api
      - run: go build ./...
      # Testing ditangguhkan (ADR-0011, keputusan owner 2026-09-27): go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        working-directory: .
        run: node scripts/sqlc-check.mjs

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: indobraga:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
