# Skema leads (inquiry + whatsapp-lead) — presenter & DTO legacy apps/api/src/leads
# (leads.service.ts:303-333, dto/*.ts). Semua key respons selalu dikirim.
LeadStatus:
  type: string
  enum: [new, contacted, in_progress, closed, spam]

Inquiry:
  type: object
  description: "`presentInquiry` (leads.service.ts:303-318)."
  required: [id, name, email, phone, company, message, status, internal_note, notification_status, source, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    name: { type: string }
    email: { type: string }
    phone: { type: string }
    company: { type: [string, "null"] }
    message: { type: string }
    status: { $ref: '#/LeadStatus' }
    internal_note: { type: [string, "null"] }
    notification_status: { type: [string, "null"], description: "`pending` saat dibuat; `sent`/`failed` setelah worker email notifikasi.", examples: ["pending"] }
    source: { type: [string, "null"], description: "Header Referer saat dikirim, atau `website`." }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

WhatsAppLead:
  type: object
  description: "`presentWhatsAppLead` (leads.service.ts:320-333). Pesan disimpan dan diekspos sebagai `generated_message`."
  required: [id, name, phone, generated_message, whatsapp_url, status, internal_note, source, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    name: { type: string }
    phone: { type: string }
    generated_message: { type: [string, "null"] }
    whatsapp_url: { type: [string, "null"], format: uri }
    status: { $ref: '#/LeadStatus' }
    internal_note: { type: [string, "null"] }
    source: { type: [string, "null"] }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

CreateInquiryInput:
  type: object
  description: Legacy `CreateInquiryDto` — semua string di-trim sebelum divalidasi.
  required: [name, email, phone, message]
  additionalProperties: false
  properties:
    name: { type: string, minLength: 2, maxLength: 120, examples: ["Budi Santoso"] }
    email: { type: string, format: email, maxLength: 190, examples: ["budi@contoh.com"] }
    phone: { type: string, pattern: '^[0-9+()\-\s]{7,30}$', examples: ["0812-3456-789"] }
    company: { type: string, maxLength: 190 }
    message: { type: string, minLength: 10, maxLength: 5000, examples: ["Halo, saya butuh kemasan box untuk kopi 250gr sebanyak 5000 pcs."] }
    website: { type: string, maxLength: 190, description: "Honeypot — biarkan kosong; bila terisi (setelah trim) API mengembalikan id 0 tanpa menyimpan." }

CreateInquiryResult:
  type: object
  required: [id, status]
  properties:
    id: { type: integer, minimum: 0, description: "0 bila honeypot terisi.", examples: [12] }
    status: { $ref: '#/LeadStatus' }

CreateWhatsAppLeadInput:
  type: object
  description: Legacy `CreateWhatsAppLeadDto` — semua string di-trim sebelum divalidasi.
  required: [name, phone]
  additionalProperties: false
  properties:
    name: { type: string, minLength: 2, maxLength: 120, examples: ["Siti"] }
    phone: { type: string, pattern: '^[0-9+()\-\s]{7,30}$', examples: ["08123456789"] }
    message: { type: string, maxLength: 700 }

CreateWhatsAppLeadResult:
  type: object
  required: [id, status, whatsapp_url, generated_message]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { $ref: '#/LeadStatus' }
    whatsapp_url: { type: string, format: uri, examples: ["https://wa.me/6281200000001?text=Halo%20Indobraga"] }
    generated_message: { type: string }

UpdateLeadInput:
  type: object
  description: Legacy `UpdateLeadDto`.
  additionalProperties: false
  properties:
    status: { $ref: '#/LeadStatus' }
    internal_note: { type: string, maxLength: 5000, description: "Di-trim." }

ArchiveLeadResult:
  type: object
  required: [id, status]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { type: string, const: archived }
