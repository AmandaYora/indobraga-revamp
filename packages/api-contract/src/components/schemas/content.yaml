SiteSettings:
  type: object
  required: [id, brand, show_brand_text, created_at, updated_at]
  properties:
    id: { type: integer, const: 1 }
    brand: { type: [string, "null"], examples: ["Indobraga"] }
    legal_name: { type: [string, "null"], examples: ["PT. Braga Indonesia Perkasa"] }
    email: { type: [string, "null"], format: email, examples: ["info@indobraga.com"] }
    phone: { type: [string, "null"], examples: ["022-123456"] }
    whatsapp: { type: [string, "null"], examples: ["6281200000001"] }
    instagram: { type: [string, "null"] }
    contact_person: { type: [string, "null"] }
    contact_role: { type: [string, "null"] }
    address: { type: [string, "null"] }
    seo_title: { type: [string, "null"] }
    seo_description: { type: [string, "null"] }
    show_brand_text: { type: boolean, examples: [false] }
    logo_media_file_id: { type: [integer, "null"], minimum: 1 }
    footer_logo_media_file_id: { type: [integer, "null"], minimum: 1 }
    og_media_file_id: { type: [integer, "null"], minimum: 1 }
    contact_hero_media_file_id: { type: [integer, "null"], minimum: 1 }
    logo_url: { type: [string, "null"], format: uri }
    footer_logo_url: { type: [string, "null"], format: uri }
    og_image_url: { type: [string, "null"], format: uri }
    contact_hero_image_url: { type: [string, "null"], format: uri }
    logo: { $ref: './common.yaml#/MediaPreview' }
    footer_logo: { $ref: './common.yaml#/MediaPreview' }
    og_image: { $ref: './common.yaml#/MediaPreview' }
    contact_hero_image: { $ref: './common.yaml#/MediaPreview' }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

ContentStatusUpdate:
  type: object
  required: [status]
  additionalProperties: false
  properties:
    status: { $ref: './common.yaml#/WritableContentStatus' }

ReorderInput:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, sort_order]
        additionalProperties: false
        properties:
          id: { $ref: './common.yaml#/Id' }
          sort_order: { type: integer, minimum: 0, maximum: 1000000 }

ReorderResult:
  type: object
  required: [status, count]
  properties:
    status: { type: string, const: updated }
    count: { type: integer, minimum: 1, examples: [7] }

ContentDeleteResult:
  type: object
  required: [id, status, cleanup_failed_media_count]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { type: string, const: permanently_deleted }
    cleanup_failed_media_count: { type: integer, minimum: 0, examples: [0] }
