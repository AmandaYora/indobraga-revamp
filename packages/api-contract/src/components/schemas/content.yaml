# Skema admin-content (12 resource + site-settings). Field dari analysis/000-legacy-inventory/backend.md.
# Setiap item wajib: status, previous_status, archived_at, created_at, updated_at.
# Slug memakai pola ^[a-z0-9]+(-[a-z0-9]+)*$.

HeroSection:
  type: object
  required: [id, title, status, previous_status, archived_at, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    title: { type: string, maxLength: 190, examples: ["Jasa Cetak Kardus & Packaging"] }
    subtitle: { type: [string, "null"], examples: ["Sejak 2010 melayani seluruh Indonesia."] }
    cta_label: { type: [string, "null"], examples: ["Hubungi Kami"] }
    cta_href: { type: [string, "null"], examples: ["/kontak"] }
    status: { $ref: './common.yaml#/ContentStatus' }
    previous_status: { type: [string, "null"], enum: [draft, published, inactive, archived, null] }
    archived_at: { $ref: './common.yaml#/NullableTimestamp' }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }
    slides:
      type: array
      description: Diisi pada detail; list tidak menyertakan slides.
      items: { $ref: '#/HeroSlide' }

HeroSlide:
  type: object
  required: [id, title, sort_order, status, previous_status, archived_at, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    hero_section_id: { type: integer, minimum: 0, description: "0 = ikut hero pertama (sentinel form); id nyata > 0.", examples: [1] }
    label: { type: [string, "null"], examples: ["Terpercaya"] }
    title: { type: string, examples: ["Cetak Offset Berkualitas"] }
    metric: { type: [string, "null"], examples: ["10.000+ pcs/hari"] }
    alt_text: { type: [string, "null"] }
    media_file_id: { type: [integer, "null"], minimum: 1 }
    media:
      $ref: './common.yaml#/MediaPreview'
      description: Pratinjau media (URL null bila belum completed).
    sort_order: { type: integer, minimum: 0, maximum: 1000000, examples: [1] }
    status: { $ref: './common.yaml#/ContentStatus' }
    previous_status: { type: [string, "null"], enum: [draft, published, inactive, archived, null] }
    archived_at: { $ref: './common.yaml#/NullableTimestamp' }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

Partner:
  type: object
  required: [id, name, sort_order, status, previous_status, archived_at, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    name: { type: string, maxLength: 190, examples: ["PT Maju Bersama"] }
    segment: { type: [string, "null"], examples: ["FMCG"] }
    logo_media_id: { type: [integer, "null"], minimum: 1 }
    logo: { $ref: './common.yaml#/MediaPreview' }
    sort_order: { type: integer, minimum: 0, maximum: 1000000, examples: [1] }
    status: { $ref: './common.yaml#/ContentStatus' }
    previous_status: { type: [string, "null"], enum: [draft, published, inactive, archived, null] }
    archived_at: { $ref: './common.yaml#/NullableTimestamp' }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

