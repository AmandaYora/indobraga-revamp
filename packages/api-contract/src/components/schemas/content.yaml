    slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', examples: ["kemasan-kopi-premium"] }
    category_id: { type: [integer, "null"], minimum: 1, description: "Wajib PUBLISHED saat create/publish.", examples: [2] }
    category: { type: [string, "null"], description: "Teks denormalisasi.", examples: ["Box & Karton"] }
    short_description: { type: [string, "null"] }
    description: { type: [string, "null"] }
    image_media_id: { type: [integer, "null"], minimum: 1, description: "Cover (gambar pertama)." }
    cover_image: { $ref: './common.yaml#/MediaPreview' }
    images:
      type: array
      description: Galeri (maks 10 saat input; diganti atomik hanya bila dikirim).
      items: { $ref: './common.yaml#/MediaPreview' }
    is_featured: { type: boolean, examples: [true] }
    sort_order: { type: integer, minimum: 0, maximum: 1000000 }
    status: { $ref: './common.yaml#/ContentStatus' }
    previous_status: { type: [string, "null"], enum: [draft, published, inactive, archived, null] }
    published_at: { $ref: './common.yaml#/NullableTimestamp' }
    seo_title: { type: [string, "null"] }
    seo_description: { type: [string, "null"] }
