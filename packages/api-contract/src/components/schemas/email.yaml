# Skema email: accounts + templates + campaigns. Field dari backend.md §email-accounts/campaigns/templates.
EmailProvider:
  type: string
  enum: [google, smtp]

EmailAccountStatus:
  type: string
  enum: [connected, invalid, disabled, needs_reconnect]

SmtpSecurity:
  type: string
  enum: [ssl_tls, starttls, none]

EmailAccount:
  type: object
  required: [id, provider, email_address, status, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    provider: { $ref: '#/EmailProvider' }
    auth_type: { type: [string, "null"], examples: ["oauth2"] }
    email_address: { type: string, format: email }
    display_name: { type: [string, "null"] }
    status: { $ref: '#/EmailAccountStatus' }
    smtp_host: { type: [string, "null"] }
    smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
    smtp_security: { type: [string, "null"], enum: [ssl_tls, starttls, none, null] }
    smtp_username: { type: [string, "null"] }
    last_validated_at: { $ref: './common.yaml#/NullableTimestamp' }
    connected_at: { $ref: './common.yaml#/NullableTimestamp' }
    last_error: { type: [string, "null"] }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

OAuthUrlInput:
  type: object
  additionalProperties: false
  properties:
    email_hint: { type: string, format: email, maxLength: 190 }
    display_name: { type: string, maxLength: 190 }

OAuthUrlResult:
  type: object
  required: [authorization_url, state_expires_at]
  properties:
    authorization_url: { type: string, format: uri, examples: ["https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx"] }
    state_expires_at: { $ref: './common.yaml#/Timestamp' }

SmtpAccountInput:
  type: object
  required: [email_address, display_name, smtp_host, smtp_port, smtp_security, smtp_username, smtp_password]
  additionalProperties: false
  properties:
    email_address: { type: string, format: email, maxLength: 190 }
    display_name: { type: string, maxLength: 190 }
    smtp_host: { type: string, maxLength: 190, examples: ["mail.indobraga.com"] }
    smtp_port: { type: integer, minimum: 1, maximum: 65535, examples: [465] }
    smtp_security: { $ref: '#/SmtpSecurity' }
    smtp_username: { type: string, maxLength: 190 }
    smtp_password: { type: string, maxLength: 1000 }

SmtpTestResult:
  type: object
  required: [valid, message]
  properties:
    valid: { type: boolean }
    message: { type: string }

UpdateEmailAccountInput:
  type: object
  additionalProperties: false
  properties:
    email_address: { type: string, format: email, maxLength: 190 }
    display_name: { type: string, maxLength: 190 }
    status: { $ref: '#/EmailAccountStatus' }
    smtp_host: { type: string, maxLength: 190 }
    smtp_port: { type: integer, minimum: 1, maximum: 65535 }
    smtp_security: { $ref: '#/SmtpSecurity' }
    smtp_username: { type: string, maxLength: 190 }
    smtp_password: { type: string, maxLength: 1000 }

SmtpReconnectResult:
  type: object
  required: [provider, valid, account, message]
  properties:
    provider: { type: string, const: smtp }
    valid: { type: boolean }
    account: { $ref: '#/EmailAccount' }
    message: { type: string }

DeleteEmailAccountResult:
  type: object
  required: [id, status]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { type: string, const: deleted }

EmailTemplate:
  type: object
  required: [id, name, subject, content_mode, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    name: { type: string, maxLength: 190 }
    subject: { type: string, maxLength: 255 }
    content_mode: { type: string, enum: [text, html] }
    body_text: { type: [string, "null"] }
    body_html: { type: [string, "null"] }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

CreateEmailTemplateInput:
  type: object
  required: [name, subject, content_mode]
  additionalProperties: false
  properties:
    name: { type: string, minLength: 1, maxLength: 190 }
    subject: { type: string, minLength: 1, maxLength: 255 }
    content_mode: { type: string, enum: [text, html] }
    body_text: { type: string }
    body_html: { type: string }

UpdateEmailTemplateInput:
  type: object
  additionalProperties: false
  properties:
    name: { type: string, minLength: 1, maxLength: 190 }
    subject: { type: string, minLength: 1, maxLength: 255 }
    content_mode: { type: string, enum: [text, html] }
    body_text: { type: string }
    body_html: { type: string }

DeleteEmailTemplateResult:
  type: object
  required: [id, status]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { type: string, const: deleted }

CampaignStatus:
  type: string
  enum: [draft, pending, processing, completed, failed, cancelled]

RecipientStatus:
  type: string
  enum: [queued, sending, sent, failed, skipped]

SenderAccount:
  type: object
  required: [id, provider, email_address, status]
  properties:
    id: { $ref: './common.yaml#/Id' }
    provider: { $ref: '#/EmailProvider' }
    email_address: { type: string, format: email }
    display_name: { type: [string, "null"] }
    status: { $ref: '#/EmailAccountStatus' }

Campaign:
  type: object
  required: [id, title, subject, status, total_recipients, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    title: { type: string, maxLength: 190 }
    subject: { type: string, maxLength: 255 }
    body_text: { type: [string, "null"] }
    body_html: { type: [string, "null"] }
    status: { $ref: '#/CampaignStatus' }
    total_recipients: { type: integer, minimum: 0 }
    queued_count: { type: integer, minimum: 0 }
    sent_count: { type: integer, minimum: 0 }
    failed_count: { type: integer, minimum: 0 }
    started_at: { $ref: './common.yaml#/NullableTimestamp' }
    finished_at: { $ref: './common.yaml#/NullableTimestamp' }
    last_error: { type: [string, "null"] }
    sender_account: { $ref: '#/SenderAccount' }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

RecipientInput:
  type: object
  required: [email]
  additionalProperties: false
  properties:
    name: { type: string, maxLength: 190 }
    email: { type: string, format: email, maxLength: 190 }
    variables:
      type: object
      maxProperties: 50
      additionalProperties: { type: string, maxLength: 2000 }

CampaignDraftInput:
  type: object
  required: [title, email_account_id, subject, recipients]
  additionalProperties: false
  properties:
    title: { type: string, minLength: 1, maxLength: 190 }
    email_account_id: { type: integer, minimum: 1 }
    subject: { type: string, minLength: 1, maxLength: 255 }
    body_text: { type: string }
    body_html: { type: string }
    recipients:
      type: array
      minItems: 1
      maxItems: 1000
      items: { $ref: '#/RecipientInput' }

CampaignFilterDraftInput:
  type: object
  required: [title, email_account_id, subject]
  additionalProperties: false
  properties:
    title: { type: string, minLength: 1, maxLength: 190 }
    email_account_id: { type: integer, minimum: 1 }
    subject: { type: string, minLength: 1, maxLength: 255 }
    body_text: { type: string }
    body_html: { type: string }
    inquiry_filter:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, maxLength: 120 }
        status: { type: string, enum: [new, contacted, in_progress, closed, spam] }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
    audience_filter:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, maxLength: 120 }
        source: { type: string, enum: [inquiry, whatsapp_lead, manual_import, manual] }
        status: { type: string, enum: [active, unsubscribed, blocked] }

CampaignDraftResult:
  type: object
  required: [id, status, total_recipients]
  properties:
    id: { $ref: './common.yaml#/Id' }
    status: { $ref: '#/CampaignStatus' }
    total_recipients: { type: integer, minimum: 1 }

InquiryRecipientPreview:
  type: object
  required: [total_inquiries, eligible_recipients, duplicate_emails, invalid_emails, recipient_limit, over_limit, sample_recipients]
  properties:
    total_inquiries: { type: integer, minimum: 0 }
    eligible_recipients: { type: integer, minimum: 0 }
    duplicate_emails: { type: integer, minimum: 0 }
    invalid_emails: { type: integer, minimum: 0 }
    recipient_limit: { type: integer, const: 1000 }
    over_limit: { type: boolean }
    sample_recipients:
      type: array
      maxItems: 5
      items:
        type: object
        properties:
          name: { type: [string, "null"] }
          email: { type: string, format: email }

CampaignRecipient:
  type: object
  required: [id, campaign_id, email, status, attempts, created_at, updated_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    campaign_id: { $ref: './common.yaml#/Id' }
    email: { type: string, format: email }
    name: { type: [string, "null"] }
    status: { $ref: '#/RecipientStatus' }
    attempts: { type: integer, minimum: 0 }
    next_attempt_at: { $ref: './common.yaml#/NullableTimestamp' }
    sent_at: { $ref: './common.yaml#/NullableTimestamp' }
    failed_at: { $ref: './common.yaml#/NullableTimestamp' }
    error_code: { type: [string, "null"] }
    error_message: { type: [string, "null"] }
    created_at: { $ref: './common.yaml#/Timestamp' }
    updated_at: { $ref: './common.yaml#/Timestamp' }

CampaignLog:
  type: object
  required: [id, campaign_id, recipient_email, status, created_at]
  properties:
    id: { $ref: './common.yaml#/Id' }
    campaign_id: { $ref: './common.yaml#/Id' }
    recipient_id: { type: [integer, "null"] }
    recipient_email: { type: string, format: email }
    provider: { type: [string, "null"] }
    status: { type: string }
    message_id: { type: [string, "null"] }
    error_code: { type: [string, "null"] }
    error_message: { type: [string, "null"] }
    response_meta:
      type: [object, "null"]
      additionalProperties: true
    created_at: { $ref: './common.yaml#/Timestamp' }

EmailTickResult:
  type: object
  required: [claimed_campaign_id, processed, sent, failed, remaining, status]
  properties:
    claimed_campaign_id: { type: [integer, "null"] }
    processed: { type: integer, minimum: 0 }
    sent: { type: integer, minimum: 0 }
    failed: { type: integer, minimum: 0 }
    remaining: { type: integer, minimum: 0 }
    status: { type: [string, "null"] }
