security: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: indobraga_admin_session
      description: |
        Cookie sesi admin (httpOnly, SameSite=Lax, Path=/, Secure hanya di produksi, Max-Age =
        `ADMIN_SESSION_TTL_DAYS` hari). Nama default `indobraga_admin_session` = default legacy
        `config/env.ts`; dapat diubah lewat `SESSION_COOKIE_NAME`.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: |
        Double-submit CSRF — nilai cookie `indobraga_csrf` (`CSRF_COOKIE_NAME`, default legacy;
        non-httpOnly) dikirim ulang di header ini untuk method non-aman pada endpoint yang butuh
        sesi. Cookie/header kosong atau berbeda → 403 `FORBIDDEN` ("Halaman sudah kedaluwarsa.
        Muat ulang halaman lalu coba lagi.").
    workerSecret:
      type: apiKey
      in: header
      name: x-internal-worker-secret
      description: Secret untuk endpoint tick worker internal (`INTERNAL_WORKER_SECRET`).
