# Fragmen public — 10 endpoint publik (site-settings, home, portfolio, kategori, fasilitas, galeri, berita, berita-slug, inquiries, whatsapp-leads).
/api/v1/public/site-settings:
  get:
    operationId: getPublicSiteSettings
    tags: [site]
    summary: Ambil pengaturan situs publik
    description: Brand, kontak, logo, SEO.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy:
      method: GET
      path: /api/v1/public/site-settings
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { schema: { type: string } }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/PublicSiteSettings' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { brand: Indobraga, legal_name: PT. Braga Indonesia Perkasa, email: info@indobraga.com, phone: 022-123456, whatsapp: '6281200000001', instagram: '@indobraga', contact_person: Admin, contact_role: Marketing, address: 'Jl. Contoh No. 1, Bandung', show_brand_text: false, logo_url: https://media.indobraga.com/logo.webp, footer_logo_url: null, contact_hero_image_url: null, seo: { title: Indobraga — Cetak Kemasan, description: Jasa cetak kemasan., og_image_url: null } }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/home:
  get:
    operationId: getPublicHome
    tags: [site]
    summary: Ambil data beranda publik
    description: Hero + partner + keunggulan + portofolio unggulan (≤6) + ringkasan fasilitas + berita terbaru (≤3).
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=60, stale-while-revalidate=300
    x-legacy:
      method: GET
      path: /api/v1/public/home
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/PublicHome' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { hero: { title: Jasa Cetak Kardus, subtitle: Sejak 2010., primary_cta: { label: Hubungi Kami, url: /kontak }, slides: [] }, partners: [], strengths: [], featured_portfolios: [], facilities_summary: { machines: [], printing_capacities: [], production_capacities: [], services: [] }, latest_news: [] }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/portfolio:
  get:
    operationId: listPublicPortfolios
    tags: [site]
    summary: Daftar portofolio publik (cursor)
    description: Keyset (sort_order, id); cursor base64url JSON; limit ≤24 default 8.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=60, stale-while-revalidate=300
    x-legacy:
      method: GET
      path: /api/v1/public/portfolio
      changes: List cursor menjadi data array + meta {limit, next_cursor, has_more} (legacy next_cursor di dalam data).
    security: []
    parameters:
      - name: category
        in: query
        required: false
        schema: { type: string }
      - name: category_slug
        in: query
        required: false
        schema: { type: string }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 8, maximum: 24 }
      - name: cursor
        in: query
        required: false
        description: Cursor dari meta.next_cursor sebelumnya.
        schema: { type: string, maxLength: 512 }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/site.yaml#/PublicPortfolioItem' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/CursorMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 1, title: Kemasan Kopi Premium, slug: kemasan-kopi-premium, category: Box & Karton, category_slug: box-karton, thumbnail_url: https://media.indobraga.com/a.webp, medium_url: null, alt_text: Kemasan kopi, short_description: Kemasan 250gr, images: [] }]
              meta: { limit: 8, next_cursor: null, has_more: false }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/portfolio-categories:
  get:
    operationId: listPublicPortfolioCategories
    tags: [site]
    summary: Daftar kategori portofolio publik
    description: Hanya kategori published yang punya portofolio published.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=60, stale-while-revalidate=300
    x-legacy:
      method: GET
      path: /api/v1/public/portfolio-categories
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items]
                      properties:
                        items: { type: array, items: { $ref: '../components/schemas/site.yaml#/PublicPortfolioCategory' } }
            example:
              success: true
              message: Data berhasil diambil.
              data: { items: [{ id: 1, name: Box & Karton, slug: box-karton, count: 8 }] }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
