      changes: Tidak ada perubahan bentuk data selain envelope v1 (data tetap {items}).
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          application/json:
            schema:
              allOf:
