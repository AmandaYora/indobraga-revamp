/api/v1/public/inquiries:
  post:
    operationId: createPublicInquiry
    tags: [leads]
    summary: Kirim pesan kontak
    description: |
      Semua string di-trim sebelum divalidasi. Honeypot `website` terisi → 201 `{id: 0, status: new}`
      tanpa menyimpan. Selain itu disimpan (`notification_status` = pending, `source` = header
      Referer atau "website", `meta` = {user_agent, referrer, ip_hash}), kontak audiens di-upsert,
      notifikasi dibuat (kegagalan keduanya tidak menggagalkan request).
    x-module: leads
    x-permission: null
    x-rate-limit:
      limit: 10
      window_seconds: 60
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/public/inquiries
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/leads.yaml#/CreateInquiryInput' }
          example: { name: Budi Santoso, email: budi@contoh.com, phone: 0812-3456-789, company: PT Contoh, message: 'Halo, saya butuh kemasan box untuk kopi 250gr sebanyak 5000 pcs.' }
    responses:
      '201':
        description: Dibuat (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/leads.yaml#/CreateInquiryResult' }
            example:
              success: true
              message: Pesan berhasil dikirim.
              data: { id: 12, status: new }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/whatsapp-leads:
  post:
    operationId: createPublicWhatsappLead
    tags: [leads]
    summary: Buat prospek WhatsApp
    description: |
      Semua string di-trim. `generated_message` = `message` bila dikirim, selain itu
      "Halo Indobraga, saya <name>. Saya ingin konsultasi kebutuhan produksi. Nomor saya <phone>.";
      `whatsapp_url` = `https://wa.me/<site_settings.whatsapp, fallback 6285158700895>?text=<encodeURIComponent(generated_message)>`.
      Notifikasi dibuat (kegagalan tidak menggagalkan request).
    x-module: leads
    x-permission: null
    x-rate-limit:
      limit: 10
      window_seconds: 60
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/public/whatsapp-leads
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/leads.yaml#/CreateWhatsAppLeadInput' }
          example: { name: Siti, phone: '08123456789', message: Saya ingin konsultasi kemasan. }
    responses:
      '201':
        description: Dibuat (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/leads.yaml#/CreateWhatsAppLeadResult' }
            example:
              success: true
              message: Data berhasil dibuat.
              data: { id: 3, status: new, whatsapp_url: 'https://wa.me/6281200000001?text=Saya%20ingin%20konsultasi%20kemasan.', generated_message: Saya ingin konsultasi kemasan. }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
