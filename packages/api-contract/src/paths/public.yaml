# Fragmen public — 10 endpoint publik (site-settings, home, portfolio, kategori, fasilitas, galeri, berita, berita-slug, inquiries, whatsapp-leads).
# Spesifikasi: legacy public-content/{public-content.controller.ts,public-content.service.ts,dto/*}
# dan leads/{leads.controller.ts,leads.service.ts,dto/*}.
/api/v1/public/site-settings:
  get:
    operationId: getPublicSiteSettings
    tags: [site]
    summary: Ambil pengaturan situs publik
    description: Brand, kontak, logo, SEO default. Baris pengaturan belum ada → 404 `NOT_FOUND` "Pengaturan website belum tersedia.".
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy:
      method: GET
      path: /api/v1/public/site-settings
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/PublicSiteSettings' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { brand: Indobraga, legal_name: PT. Braga Indonesia Perkasa, email: info@indobraga.com, phone: 022-123456, whatsapp: '6281200000001', instagram: indobraga, contact_person: Admin, contact_role: Marketing, address: 'Jl. Contoh No. 1, Bandung', show_brand_text: false, logo_url: https://media.indobraga.com/upload/prod/lainnya/2026-05-12/logo-large.webp, footer_logo_url: null, contact_hero_image_url: null, seo: { title: Indobraga — Cetak Kemasan, description: Jasa cetak kemasan., og_image_url: null } }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/home:
  get:
    operationId: getPublicHome
    tags: [site]
    summary: Ambil data beranda publik
    description: |
      Hero (`null` bila tidak ada yang published) + partner + keunggulan + portofolio unggulan (≤ 6) +
      ringkasan fasilitas (mesin ≤ 3, kapasitas cetak ≤ 3, kapasitas produksi ≤ 6, layanan ≤ 10) +
      berita terbaru (≤ 3). Hanya item `published`.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=60, stale-while-revalidate=300
    x-legacy:
      method: GET
      path: /api/v1/public/home
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/PublicHome' }
            example:
              success: true
              message: Data berhasil diambil.
              data:
                hero:
                  title: Jasa Cetak Kardus
                  subtitle: Sejak 2010.
                  primary_cta: { label: Hubungi Kami, url: /kontak }
                  slides:
                    - { id: 1, label: Terpercaya, title: Cetak Offset Berkualitas, metric: 10.000+ pcs/hari, image_url: https://media.indobraga.com/upload/prod/hero/2026-05-12/s1-large.webp, alt_text: Cetak Offset Berkualitas }
                partners:
                  - { id: 1, name: PT Maju Bersama, segment: FMCG, logo_url: null }
                strengths:
                  - { id: 1, label: Kapasitas Harian, value: '50.000', suffix: pcs }
