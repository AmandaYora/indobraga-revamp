                facilities_summary:
                  machines:
                    - { id: 1, name: Heidelberg Speedmaster, slug: heidelberg-speedmaster, metric: 18.000 lbr/jam, description: null, image_url: null, alt_text: Heidelberg Speedmaster }
                  printing_capacities:
                    - { id: 1, label: Offset Printing, value: '50.000', unit: lembar/hari, description: null, image_url: null, alt_text: Offset Printing }
                  production_capacities:
                    - { id: 1, product: Kardus Box, value: '100.000', unit: pcs/bulan }
                  services:
                    - { id: 1, name: Desain Kemasan }
                latest_news:
                  - { id: 1, title: Tips Memilih Kemasan, slug: tips-memilih-kemasan, category: Tips, thumbnail_url: null, excerpt: Ringkasan., published_at: 2026-05-12T08:30:00.000Z }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/portfolio:
  get:
    operationId: listPublicPortfolios
    tags: [site]
    summary: Daftar portofolio publik (cursor)
    description: |
      Portofolio `published` dengan kategori `published`, keyset (sort_order, id) naik. Filter
      kategori: `category_slug` ?? `category`, dicocokkan ke slug ATAU nama kategori.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=60, stale-while-revalidate=300
    x-legacy:
      method: GET
      path: /api/v1/public/portfolio
      changes: List cursor menjadi data array + meta {limit, next_cursor, has_more} (legacy {items, next_cursor, has_more} di dalam data, tanpa limit).
    security: []
    parameters:
      - name: category
        in: query
        required: false
        description: Di-trim. Slug atau nama kategori (dipakai bila `category_slug` tidak dikirim).
        schema: { type: string }
      - name: category_slug
        in: query
        required: false
        description: Di-trim. Slug atau nama kategori.
        schema: { type: string }
      - name: limit
        in: query
        required: false
        description: 1–24; di luar rentang → 400 `VALIDATION_ERROR`.
        schema: { type: integer, minimum: 1, default: 8, maximum: 24 }
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/site.yaml#/PublicPortfolioItem' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/CursorMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data:
                - id: 1
                  title: Kemasan Kopi Premium
                  slug: kemasan-kopi-premium
                  category: Box & Karton
                  category_slug: box-karton
                  thumbnail_url: https://media.indobraga.com/upload/prod/portofolio/2026-05-12/p1-thumbnail.webp
                  medium_url: https://media.indobraga.com/upload/prod/portofolio/2026-05-12/p1-medium.webp
                  alt_text: Kemasan Kopi Premium
                  short_description: Kemasan 250gr
                  images:
                    - { thumbnail_url: https://media.indobraga.com/upload/prod/portofolio/2026-05-12/p1-thumbnail.webp, medium_url: https://media.indobraga.com/upload/prod/portofolio/2026-05-12/p1-medium.webp, large_url: https://media.indobraga.com/upload/prod/portofolio/2026-05-12/p1-large.webp, alt_text: Kemasan Kopi Premium }
              meta: { limit: 8, next_cursor: null, has_more: false }
      '400': { $ref: '../components/responses.yaml#/InvalidRequest' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
