/api/v1/admin/media/{id}/retry:
  post:
    operationId: retryMedia
    tags: [media]
    summary: Coba lagi media gagal
    description: |
      Hanya untuk status `failed` (selain itu → 400 `BAD_REQUEST` "Media ini belum perlu diproses
      ulang."). File asli tidak disimpan, sehingga hanya menulis ulang `error` = "File asli sudah tidak
      tersedia. Silakan unggah ulang media ini." (status tetap `failed`).
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/media/{id}/retry
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '201':
        description: Berhasil (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/media.yaml#/MediaItem' }
            example:
              success: true
              message: Data berhasil diubah.
              data: { id: 10, media_type: image, mime_type: image/webp, original_file_name: hero-1.jpg, compression_status: failed, file_url: null, thumbnail_url: null, medium_url: null, large_url: null, poster_url: null, video_url: null, width: null, height: null, duration_seconds: null, original_size: 123456, optimized_size: null, error: Gagal memproses., archived_at: null, deleted_at: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/InvalidRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
