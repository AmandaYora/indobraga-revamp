# Fragmen media — 7 endpoint.
/api/v1/admin/media:
  get:
    operationId: listMedia
    tags: [media]
    summary: Daftar media
    description: |
      List offset (default 16, maks 100), urut created_at desc, id desc. Tanpa filter `compression_status`, media `archived`/`pending_delete`/`deleted`/`cleanup_failed` disembunyikan.
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/media
      changes: "Tidak ada perubahan bentuk data selain envelope v1."
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 16, maximum: 100 }
      - name: q
        in: query
        required: false
        description: Di-trim; mencari nama file asli & MIME.
        schema: { type: string }
      - name: media_type
        in: query
        required: false
        schema: { type: string, enum: [image, video, document] }
      - name: compression_status
        in: query
        required: false
        schema: { type: string, enum: [processing, completed, failed, archived, pending_delete, deleted, cleanup_failed] }
      - name: usage
        in: query
        required: false
        description: Di-trim; dicocokkan persis ke `usage` saat upload (teks bebas, tidak divalidasi enum).
        schema: { type: string }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/media.yaml#/MediaItem' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 10, media_type: image, mime_type: image/webp, original_file_name: hero-1.jpg, compression_status: completed, file_url: https://media.indobraga.com/l.webp, thumbnail_url: null, medium_url: null, large_url: null, poster_url: null, video_url: null, width: 1600, height: 900, duration_seconds: null, original_size: 123456, optimized_size: 98765, error: null, archived_at: null, deleted_at: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }]
              meta: { page: 1, limit: 16, total: 1, total_pages: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  post:
    operationId: uploadMedia
    tags: [media]
    summary: Unggah media
    description: |
      multipart/form-data, field file `file` (disimpan di memori; batas multer 100 MB → 413).
      File tidak dikirim → 400 `VALIDATION_ERROR` "File wajib diunggah."; file di field lain → 400
      `BAD_REQUEST`. Tipe dideteksi dari magic bytes (bukan ekstensi/MIME klien): tidak dikenali → 415.
      Gambar > `UPLOAD_IMAGE_MAX_MB` (10) / video > `UPLOAD_VIDEO_MAX_MB` (100) → 413 "Ukuran
      gambar|video melebihi batas N MB.". Gambar diproses sinkron (rotasi EXIF; varian WebP q82 lebar
      480/960/1600) → `completed`; video disimpan apa adanya → `completed`.
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/media
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [file, usage]
            properties:
              file: { type: string, format: binary, description: Gambar (≤10MB) atau video (≤100MB). }
              usage: { $ref: '../components/schemas/media.yaml#/MediaUsage' }
              alt_text: { type: string, description: "Di-trim; hanya disimpan di metadata varian (tidak diekspos)." }
              caption: { type: string, description: "Di-trim; hanya disimpan di metadata varian (tidak diekspos)." }
          encoding:
            file: { contentType: application/octet-stream }
    responses:
      '201':
        description: Dibuat (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/media.yaml#/MediaItem' }
            example:
              success: true
              message: Data berhasil dibuat.
              data: { id: 10, media_type: image, mime_type: image/webp, original_file_name: hero-1.jpg, compression_status: completed, file_url: https://media.indobraga.com/l.webp, thumbnail_url: null, medium_url: null, large_url: null, poster_url: null, video_url: null, width: 1600, height: 900, duration_seconds: null, original_size: 123456, optimized_size: 98765, error: null, archived_at: null, deleted_at: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/InvalidRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/media/{id}:
  get:
    operationId: getMedia
    tags: [media]
    summary: Detail media
    description: |
      Detail media (status apa pun). Tidak ada → 404 "Media tidak ditemukan.".
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/media/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/media.yaml#/MediaItem' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { id: 10, media_type: image, mime_type: image/webp, original_file_name: hero-1.jpg, compression_status: completed, file_url: https://media.indobraga.com/l.webp, thumbnail_url: null, medium_url: null, large_url: null, poster_url: null, video_url: null, width: 1600, height: 900, duration_seconds: null, original_size: 123456, optimized_size: 98765, error: null, archived_at: null, deleted_at: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  delete:
    operationId: deleteMedia
    tags: [media]
    summary: Hapus permanen media
    description: |
      Hapus permanen. Masih dirujuk konten/pengaturan → 409 `CONFLICT` "Media masih dipakai oleh
      konten website. Lepaskan dari konten terlebih dahulu.". Penghapusan objek storage gagal → status
      `cleanup_failed` dan 409 `MEDIA_CLEANUP_FAILED` "Media belum berhasil dihapus dari penyimpanan.
      Coba lagi atau hubungi administrator.".
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: DELETE
      path: /api/v1/admin/media/{id}
      changes: "Gagal hapus storage mengembalikan code `MEDIA_CLEANUP_FAILED` + pesan domain (BC-04); legacy melebur code tak dikenal menjadi `CONFLICT` dengan pesan generik \"Data yang sama sudah ada.\"."
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/media.yaml#/DeleteMediaResult' }
            example:
              success: true
              message: Data berhasil dihapus permanen.
              data: { id: 10, status: permanently_deleted }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/media/{id}/archive:
  patch:
    operationId: archiveMedia
    tags: [media]
    summary: Arsipkan media
    description: |
      Arsipkan (`previous_status` = status saat ini; bila sudah archived dipertahankan, tanpa error). Masih dirujuk → 409 `CONFLICT`. Tidak ada → 404.
    x-module: media
    x-permission: media.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: PATCH
      path: /api/v1/admin/media/{id}/archive
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
