# Fragmen leads admin — 8 endpoint.
/api/v1/admin/inquiries:
  get:
    operationId: listInquiries
    tags: [leads]
    summary: Daftar pesan kontak
    description: |
      Pesan kontak belum diarsip, urut created_at desc, id desc. `q` (di-trim) mencari name, email, phone, company, message.
    x-module: leads
    x-permission: leads.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/inquiries
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      - name: q
        in: query
        required: false
        schema: { type: string }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [new, contacted, in_progress, closed, spam] }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/leads.yaml#/Inquiry' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 1, name: Budi, email: budi@contoh.com, phone: '08123456789', company: null, message: Halo., status: new, internal_note: null, notification_status: pending, source: website, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }]
              meta: { page: 1, limit: 10, total: 1, total_pages: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/inquiries/{id}:
  get:
    operationId: getInquiry
    tags: [leads]
    summary: Detail pesan kontak
    description: |
      Diarsip atau tidak ada → 404 `NOT_FOUND` "Pesan kontak tidak ditemukan.".
    x-module: leads
    x-permission: leads.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/inquiries/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/leads.yaml#/Inquiry' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { id: 1, name: Budi, email: budi@contoh.com, phone: '08123456789', company: null, message: Halo., status: new, internal_note: null, notification_status: pending, source: website, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  patch:
    operationId: updateInquiry
    tags: [leads]
    summary: Ubah pesan kontak
    description: |
      Ubah `status` dan/atau `internal_note`. Diarsip atau tidak ada → 404.
    x-module: leads
    x-permission: leads.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: PATCH
      path: /api/v1/admin/inquiries/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/leads.yaml#/UpdateLeadInput' }
          example: { status: contacted, internal_note: Sudah dihubungi. }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/leads.yaml#/Inquiry' }
            example:
              success: true
              message: Data berhasil diubah.
              data: { id: 1, name: Budi, email: budi@contoh.com, phone: '08123456789', company: null, message: Halo., status: contacted, internal_note: Sudah dihubungi., notification_status: sent, source: website, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  delete:
    operationId: archiveInquiry
    tags: [leads]
    summary: Arsipkan pesan kontak
    description: |
      Soft-archive (`archived_at` = now); tanpa unarchive/hard-delete. Sudah diarsip atau tidak ada → 404.
    x-module: leads
    x-permission: leads.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: DELETE
      path: /api/v1/admin/inquiries/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/leads.yaml#/ArchiveLeadResult' }
            example:
              success: true
              message: Data berhasil diarsipkan.
              data: { id: 1, status: archived }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
