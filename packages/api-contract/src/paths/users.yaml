    tags: [users]
    summary: Ubah status user admin
    description: |
      Aktif/nonaktif. Menonaktifkan: 403 bila akun sendiri atau Super Admin aktif terakhir; sesi user dicabut. `content_editor` → `super_admin` → 404.
    x-module: users
    x-permission: users.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
