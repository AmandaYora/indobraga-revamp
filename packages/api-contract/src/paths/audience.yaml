# Fragmen audience — 3 endpoint.
/api/v1/admin/audience/contacts:
  get:
    operationId: listAudienceContacts
    tags: [audience]
    summary: Daftar kontak marketing
    description: |
      List offset, urut last_interaction_at desc, created_at desc, id desc. `limit` > 100 TIDAK ditolak — di-clamp ke 100 (`meta.limit` = 100; legacy `ListAudienceQueryDto` tanpa `@Max`).
    x-module: audience
    x-permission: audience.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/audience/contacts
      changes: "Tidak ada perubahan bentuk data selain envelope v1."
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        description: Bilangan bulat ≥ 1; nilai > 100 di-clamp menjadi 100.
        schema: { type: integer, minimum: 1, default: 10 }
      - name: q
        in: query
        required: false
        description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
        schema: { type: string, maxLength: 120 }
      - name: source
        in: query
        required: false
        schema: { type: string, enum: [inquiry, whatsapp_lead, manual_import, manual] }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [active, unsubscribed, blocked] }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/audience.yaml#/MarketingContact' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 1, name: Budi, email: budi@contoh.com, phone: '08123456789', company: null, source: inquiry, source_ref_id: 1, status: active, consent_status: implied, last_interaction_at: 2026-05-12T08:30:00.000Z, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }]
              meta: { page: 1, limit: 10, total: 1, total_pages: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/audience/preview:
  get:
    operationId: previewAudience
    tags: [audience]
    summary: Pratinjau audiens
    description: |
      Ringkasan audiens untuk draf kampanye. Filter `status` divalidasi tetapi diabaikan (total dihitung dari `q`/`source`; eligible = kontak `active`).
    x-module: audience
    x-permission: audience.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/audience/preview
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: q
        in: query
        required: false
        description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
        schema: { type: string, maxLength: 120 }
      - name: source
        in: query
        required: false
        schema: { type: string, enum: [inquiry, whatsapp_lead, manual_import, manual] }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [active, unsubscribed, blocked] }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/audience.yaml#/AudiencePreview' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { total_contacts: 10, eligible_recipients: 8, excluded_unsubscribed: 1, excluded_blocked: 1, sample_recipients: [{ id: 1, name: Budi, email: budi@contoh.com, company: null }] }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/audience/export.csv:
  get:
    operationId: exportAudienceCsv
    tags: [audience]
    summary: Ekspor audiens CSV
    description: |
      CSV tanpa envelope, maks 10.000 baris (urut last_interaction_at desc, created_at desc, id desc).
      Header respons: `Content-Type: text/csv; charset=utf-8`, `Content-Disposition: attachment;
      filename="indobraga-audience.csv"` (+ `Cache-Control: no-store`). Body: BOM UTF-8 (`\uFEFF`), baris
      dipisah CRLF (`\r\n`) termasuk setelah baris terakhir, setiap sel di-quote (`"` di-escape `""`).
      Kolom: Nama, Email, Telepon, Perusahaan, Sumber, Status, Consent, Interaksi Terakhir, Dibuat
      (nilai enum lowercase; tanggal ISO 8601 UTC lengkap; null → string kosong).
    x-module: audience
    x-permission: audience.export
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/audience/export.csv
      changes: Sama persis (text/csv tanpa envelope).
    security: [{ sessionCookie: [] }]
    parameters:
      - name: q
        in: query
        required: false
        description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
        schema: { type: string, maxLength: 120 }
      - name: source
        in: query
        required: false
        schema: { type: string, enum: [inquiry, whatsapp_lead, manual_import, manual] }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [active, unsubscribed, blocked] }
    responses:
      '200':
        description: File CSV.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Content-Type: { schema: { type: string, const: text/csv; charset=utf-8 } }
          Content-Disposition: { schema: { type: string, const: 'attachment; filename="indobraga-audience.csv"' } }
        content:
          text/csv:
            schema: { type: string }
            example: "\uFEFF\"Nama\",\"Email\",\"Telepon\",\"Perusahaan\",\"Sumber\",\"Status\",\"Consent\",\"Interaksi Terakhir\",\"Dibuat\"\r\n\"Budi\",\"budi@contoh.com\",\"08123456789\",\"\",\"inquiry\",\"active\",\"implied\",\"2026-05-12T08:30:00.000Z\",\"2026-05-12T08:30:00.000Z\"\r\n"
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
