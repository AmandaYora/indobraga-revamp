# Fragmen campaigns — 12 endpoint (termasuk worker tick).
/api/v1/admin/email-campaigns:
  get:
    operationId: listEmailCampaigns
    tags: [campaigns]
    summary: Daftar kampanye email
    description: Status SENDING legacy diekspos sebagai processing.
    x-module: campaigns
    x-permission: email_campaigns.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-campaigns
      changes: Prisma SENDING diekspos sebagai processing; selain itu hanya envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      - name: q
        in: query
        required: false
        schema: { type: string }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [draft, pending, processing, completed, failed, cancelled] }
      - name: email_account_id
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/email.yaml#/Campaign' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 1, title: Promo Lebaran, subject: Diskon, status: draft, total_recipients: 10, queued_count: 10, sent_count: 0, failed_count: 0, sender_account: { id: 1, provider: smtp, email_address: marketing@indobraga.com, display_name: Marketing, status: connected }, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }]
              meta: { page: 1, limit: 10, total: 1, total_pages: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-campaigns/recipient-sources/inquiries/preview:
  get:
    operationId: previewInquiryRecipients
