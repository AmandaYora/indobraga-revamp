                    data: { $ref: '../components/schemas/email.yaml#/Campaign' }
            example:
              success: true
              message: Data berhasil diubah.
              data: { id: 1, title: Promo Lebaran, subject: Diskon Terbaru, status: draft, total_recipients: 10, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
