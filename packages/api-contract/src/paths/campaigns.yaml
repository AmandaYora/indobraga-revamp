  patch:
    operationId: updateEmailCampaign
    tags: [campaigns]
    summary: Ubah draf kampanye
    description: Hanya draf (422 bila bukan); recipients mengganti semua.
    x-module: campaigns
    x-permission: email_campaigns.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: PATCH
      path: /api/v1/admin/email-campaigns/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
