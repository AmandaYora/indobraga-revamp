# Fragmen campaigns — 12 endpoint (termasuk worker tick).
/api/v1/admin/email-campaigns:
  get:
    operationId: listEmailCampaigns
    tags: [campaigns]
    summary: Daftar kampanye email
    description: |
      List offset, urut created_at desc, id desc. `q` (di-trim) mencari title, subject, email akun pengirim.
    x-module: campaigns
    x-permission: email_campaigns.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-campaigns
      changes: "Tidak ada perubahan bentuk data selain envelope v1."
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      - name: q
        in: query
        required: false
        description: Di-trim.
        schema: { type: string }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [draft, pending, processing, completed, failed, cancelled] }
      - name: email_account_id
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/email.yaml#/Campaign' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example: {"success": true, "message": "Data berhasil diambil.", "data": [{"id": 1, "title": "Promo Lebaran", "subject": "Diskon Kemasan", "body_text": "Halo {{ nama }}", "body_html": "<p>Halo {{ nama }}</p>", "status": "draft", "total_recipients": 10, "queued_count": 10, "sent_count": 0, "failed_count": 0, "started_at": null, "finished_at": null, "last_error": null, "sender_account": {"id": 1, "provider": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing", "status": "connected"}, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}], "meta": {"page": 1, "limit": 10, "total": 1, "total_pages": 1}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-campaigns/recipient-sources/inquiries/preview:
  get:
    operationId: previewInquiryRecipients
    tags: [campaigns]
    summary: Pratinjau penerima dari inquiry
    description: |
      Analisis penerima dari Pesan Kontak (legacy `InquiryRecipientFilterDto`): maks 10.000 inquiry
      terbaru yang belum diarsip; tanpa `status` → semua kecuali `spam`. Email di-trim/lowercase,
      invalid & duplikat dihitung terpisah. Melebihi batas TIDAK error — ditandai `over_limit`.
      `date_from` > `date_to` → 422.
    x-module: campaigns
    x-permission: email_campaigns.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-campaigns/recipient-sources/inquiries/preview
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: q
        in: query
        required: false
        description: Di-trim; mencari name, email, phone, company, message.
        schema: { type: string, maxLength: 120 }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [new, contacted, in_progress, closed, spam] }
      - name: date_from
        in: query
        required: false
        description: Di-trim; ISO 8601 (`IsDateString`, tanggal atau tanggal-waktu). Hanya YYYY-MM-DD (10 karakter pertama) dipakai → awal hari Asia/Jakarta (+07:00).
        schema: { type: string }
      - name: date_to
        in: query
        required: false
        description: Seperti `date_from` → akhir hari (23:59:59.999 +07:00).
        schema: { type: string }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/InquiryRecipientPreview' }
            example: {"success": true, "message": "Data berhasil diambil.", "data": {"total_inquiries": 10, "eligible_recipients": 8, "duplicate_emails": 1, "invalid_emails": 1, "recipient_limit": 1000, "over_limit": false, "sample_recipients": [{"id": 12, "name": "Budi Santoso", "email": "budi@contoh.com", "company": "PT Contoh", "status": "new", "created_at": "2026-05-12T08:30:00.000Z"}]}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-campaigns/{id}:
  get:
    operationId: getEmailCampaign
    tags: [campaigns]
    summary: Detail kampanye email
    description: |
      Tidak ada → 404 `NOT_FOUND` "Email massal tidak ditemukan.".
    x-module: campaigns
    x-permission: email_campaigns.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-campaigns/{id}
      changes: "Tidak ada perubahan bentuk data selain envelope v1."
    security: [{ sessionCookie: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/Campaign' }
            example: {"success": true, "message": "Data berhasil diambil.", "data": {"id": 1, "title": "Promo Lebaran", "subject": "Diskon Kemasan", "body_text": "Halo {{ nama }}", "body_html": "<p>Halo {{ nama }}</p>", "status": "draft", "total_recipients": 10, "queued_count": 10, "sent_count": 0, "failed_count": 0, "started_at": null, "finished_at": null, "last_error": null, "sender_account": {"id": 1, "provider": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing", "status": "connected"}, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  patch:
    operationId: updateEmailCampaign
    tags: [campaigns]
    summary: Ubah draf kampanye
    description: |
      Hanya kampanye `draft` (selain itu → 422 "Hanya draf email yang bisa diubah."). `email_account_id`
      wajib akun `connected` (422). `recipients` dikirim → semua penerima diganti (dedup, dinormalisasi
      seperti draf) dan hitungan di-reset; > `EMAIL_CAMPAIGN_RECIPIENT_MAX` → 422. Body HTML dihitung
      ulang bila `body_text`/`body_html` dikirim (keduanya kosong → 422). Field string TIDAK di-trim
      (legacy `UpdateCampaignDto` tanpa Transform). Batas body 5 MB (BC-06).
    x-module: campaigns
    x-permission: email_campaigns.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-body-limit-bytes: 5242880
    x-legacy:
      method: PATCH
      path: /api/v1/admin/email-campaigns/{id}
      changes: "Batas body JSON 5 MB (BC-06; legacy 100 KB default Express)."
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              title: { type: string, maxLength: 190 }
              email_account_id: { type: integer, minimum: 1 }
              subject: { type: string, maxLength: 255 }
              body_text: { type: string }
              body_html: { type: string }
              recipients:
                type: array
                minItems: 1
                maxItems: 1000
                items: { $ref: '../components/schemas/email.yaml#/RecipientInput' }
          example: { subject: Diskon Terbaru }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/Campaign' }
            example: {"success": true, "message": "Data berhasil diubah.", "data": {"id": 1, "title": "Promo Lebaran", "subject": "Diskon Kemasan Terbaru", "body_text": "Halo {{ nama }}", "body_html": "<p>Halo {{ nama }}</p>", "status": "draft", "total_recipients": 10, "queued_count": 10, "sent_count": 0, "failed_count": 0, "started_at": null, "finished_at": null, "last_error": null, "sender_account": {"id": 1, "provider": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing", "status": "connected"}, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-campaigns/draft:
  post:
    operationId: createCampaignDraft
    tags: [campaigns]
    summary: Buat draf kampanye manual
    description: |
      Draf manual. Penerima 1–1000 item, lalu di-dedup per email lowercase (hasil > batas → 422).
      Akun pengirim wajib `connected` (422 "Akun pengirim harus sudah terhubung."). `body_html`
      bermakna dipakai apa adanya, selain itu `body_text` dikonversi ke `<p>`; keduanya kosong → 422.
      Variabel penerima dinormalisasi (lihat `RecipientInput.variables`). Batas body 5 MB (BC-06).
    x-module: campaigns
    x-permission: email_campaigns.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-body-limit-bytes: 5242880
    x-legacy:
      method: POST
      path: /api/v1/admin/email-campaigns/draft
      changes: "Batas body JSON 5 MB (BC-06; legacy 100 KB default Express)."
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/CampaignDraftInput' }
          example: { title: Promo Lebaran, email_account_id: 1, subject: Diskon, body_html: "<p>Halo {{ nama }}</p>", recipients: [{ email: budi@contoh.com, name: Budi }] }
    responses:
      '201':
        description: Dibuat (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/CampaignDraftResult' }
            example:
              success: true
              message: Data berhasil dibuat.
              data: { id: 1, status: draft, total_recipients: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
