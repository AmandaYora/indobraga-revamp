/api/v1/internal/workers/email-campaigns/tick:
  post:
    operationId: tickEmailCampaigns
    tags: [campaigns]
    summary: Tick worker kampanye email
    description: |
      Pemicu manual worker kampanye (header `x-internal-worker-secret`; salah/tidak ada → 401). Worker
      in-app legacy juga berjalan tiap `EMAIL_WORKER_POLL_MS`. Single-flight: bila drain lain sedang
      berjalan → `status: idle` tanpa memproses. Sebelum klaim, lock kampanye/penerima yang lebih tua
      dari `EMAIL_WORKER_STALE_MS` dilepas. Satu tick = satu batch (`EMAIL_WORKER_BATCH_SIZE`, 50) dari
      satu kampanye; tanpa CSRF.
    x-module: campaigns
    x-permission: null
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/internal/workers/email-campaigns/tick
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ workerSecret: [] }]
    responses:
      '201':
        description: Berhasil (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/EmailTickResult' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { claimed_campaign_id: 1, processed: 50, sent: 48, failed: 2, remaining: 0, status: completed }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
