# Fragmen auth — login/logout/me.
/api/v1/auth/login:
  post:
    operationId: login
    tags: [auth]
    summary: Login admin
    description: |
      Login dengan email & password; status 200 (legacy `@HttpCode(200)`). Mengeset cookie sesi
      `indobraga_admin_session` (httpOnly) dan cookie CSRF `indobraga_csrf` (non-httpOnly), masa
      berlaku `ADMIN_SESSION_TTL_DAYS` (7) hari. Tanpa CSRF. User tidak ada / nonaktif / password
      salah → 401 `UNAUTHENTICATED` "Email atau kata sandi belum sesuai.". Rate limit 5/60 dtk per IP.
    x-module: auth
    x-permission: null
    x-rate-limit:
      limit: 5
      window_seconds: 60
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/auth/login
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/LoginInput' }
          example: { email: admin@indobraga.com, password: rahasia123 }
    responses:
      '200':
        description: Login berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Set-Cookie: { $ref: '../components/headers.yaml#/SetCookie' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/LoginResult' }
            example:
              success: true
              message: Login berhasil.
              data:
                user: { id: 1, name: Admin Utama, email: admin@indobraga.com, role: super_admin, permissions: [dashboard.read, users.manage] }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/auth/logout:
  post:
    operationId: logout
    tags: [auth]
    summary: Logout admin
    description: |
      Status 200 (legacy `@HttpCode(200)`). Wajib sesi valid (401) dan CSRF (403). Mencabut sesi
      (`revoked_at`) lalu menghapus kedua cookie lewat dua header `Set-Cookie` kedaluwarsa.
    x-module: auth
    x-permission: null
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/auth/logout
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    responses:
      '200':
        description: Logout berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Set-Cookie: { $ref: '../components/headers.yaml#/ClearCookie' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/LogoutResult' }
            example:
              success: true
              message: Logout berhasil.
              data: { status: logged_out }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/auth/me:
  get:
    operationId: getSessionUser
    tags: [auth]
    summary: Ambil user sesi
    description: Mengembalikan user dari sesi aktif (sesi tidak ada/dicabut/kedaluwarsa/user nonaktif → 401).
    x-module: auth
    x-permission: null
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/auth/me
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/auth.yaml#/LoginResult' }
            example:
              success: true
              message: Data berhasil diambil.
              data:
                user: { id: 1, name: Admin Utama, email: admin@indobraga.com, role: super_admin, permissions: [dashboard.read] }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
