/api/v1/admin/email-accounts/{id}:
  patch:
    operationId: updateEmailAccount
    tags: [emailaccounts]
    summary: Ubah akun email
    description: |
      Akun Google: hanya `display_name`/`status`; field SMTP atau `email_address` → 400 `BAD_REQUEST`
      "Akun Google perlu dihubungkan ulang untuk mengubah aksesnya.". Akun SMTP: perubahan field SMTP /
      `email_address` memicu verifikasi ulang (gagal → 422; password tersimpan dipakai bila
      `smtp_password` tidak dikirim, tidak ada → 422) lalu status `connected` bila `status` tidak
      dikirim. `status: connected` mengisi `connected_at` & menghapus `last_error`. Email bentrok dengan
      akun SMTP lain → 409 `CONFLICT` "Akun pengirim dengan alamat email tersebut sudah ada.".
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: PATCH
      path: /api/v1/admin/email-accounts/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/UpdateEmailAccountInput' }
          example: { display_name: Marketing Baru }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/EmailAccount' }
            example: {"success": true, "message": "Data berhasil diubah.", "data": {"id": 1, "provider": "smtp", "auth_type": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing Baru", "status": "connected", "smtp_host": "mail.indobraga.com", "smtp_port": 465, "smtp_security": "ssl_tls", "smtp_username": "marketing@indobraga.com", "last_validated_at": "2026-05-12T08:30:00.000Z", "connected_at": "2026-05-12T08:30:00.000Z", "last_error": null, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}}
      '400': { $ref: '../components/responses.yaml#/InvalidRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  delete:
    operationId: deleteEmailAccount
    tags: [emailaccounts]
    summary: Hapus akun email
    description: |
      Hard-delete. Masih dipakai kampanye → 422 "Akun ini dipakai oleh N pengiriman email sehingga
      tidak bisa dihapus permanen. Nonaktifkan akun agar riwayat pengiriman tetap tersimpan.".
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: DELETE
      path: /api/v1/admin/email-accounts/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/DeleteEmailAccountResult' }
            example:
              success: true
              message: Data berhasil dihapus.
              data: { id: 1, status: deleted }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-accounts/{id}/reconnect:
  post:
    operationId: reconnectEmailAccount
    tags: [emailaccounts]
    summary: Sambung ulang akun email
    description: |
      Google → URL OAuth baru (`{authorization_url, state_expires_at}`, sama dengan `oauth-url`).
      SMTP → verifikasi ulang kredensial tersimpan: berhasil → `connected`; gagal → `needs_reconnect`
      + `last_error` (tetap 201, `valid: false`). Konfigurasi SMTP tidak lengkap (host/port/password)
      → 422 "Konfigurasi SMTP belum lengkap. Ubah akun dan lengkapi detail SMTP terlebih dahulu.".
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/email-accounts/{id}/reconnect
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '201':
        description: Berhasil (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/EmailAccountReconnectResult' }
            examples:
              smtp:
                summary: Akun SMTP
                value: {"success": true, "message": "Data berhasil diambil.", "data": {"provider": "smtp", "valid": true, "account": {"id": 1, "provider": "smtp", "auth_type": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing", "status": "connected", "smtp_host": "mail.indobraga.com", "smtp_port": 465, "smtp_security": "ssl_tls", "smtp_username": "marketing@indobraga.com", "last_validated_at": "2026-05-12T08:30:00.000Z", "connected_at": "2026-05-12T08:30:00.000Z", "last_error": null, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}, "message": "Koneksi SMTP berhasil. Akun aktif kembali."}}
              google:
                summary: Akun Google
                value: {"success": true, "message": "Data berhasil diambil.", "data": {"authorization_url": "https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx&state=yyy", "state_expires_at": "2026-05-12T08:40:00.000Z"}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
