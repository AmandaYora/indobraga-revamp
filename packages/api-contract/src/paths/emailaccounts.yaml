# Fragmen email-accounts — 9 endpoint (termasuk callback OAuth).
/api/v1/admin/email-accounts:
  get:
    operationId: listEmailAccounts
    tags: [emailaccounts]
    summary: Daftar akun email
    description: |
      List offset, urut created_at desc, id desc. `q` (di-trim) mencari email, display_name, smtp_host, smtp_username. Secret tidak pernah dikembalikan.
    x-module: emailaccounts
    x-permission: email_accounts.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-accounts
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      - name: q
        in: query
        required: false
        description: Di-trim.
        schema: { type: string }
      - name: provider
        in: query
        required: false
        schema: { type: string, enum: [google, smtp] }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [connected, invalid, disabled, needs_reconnect] }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/email.yaml#/EmailAccount' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example: {"success": true, "message": "Data berhasil diambil.", "data": [{"id": 1, "provider": "smtp", "auth_type": "smtp", "email_address": "marketing@indobraga.com", "display_name": "Marketing", "status": "connected", "smtp_host": "mail.indobraga.com", "smtp_port": 465, "smtp_security": "ssl_tls", "smtp_username": "marketing@indobraga.com", "last_validated_at": "2026-05-12T08:30:00.000Z", "connected_at": "2026-05-12T08:30:00.000Z", "last_error": null, "created_at": "2026-05-12T08:30:00.000Z", "updated_at": "2026-05-12T08:30:00.000Z"}], "meta": {"page": 1, "limit": 10, "total": 1, "total_pages": 1}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-accounts/google/oauth-url:
  post:
    operationId: getGoogleOAuthUrl
    tags: [emailaccounts]
    summary: Buat URL OAuth Google
    description: |
      Body opsional. State = base64url(JSON{nonce, admin_user_id, exp}) + "." + base64url(HMAC-SHA256
      SESSION_SECRET); disimpan sebagai sha256 hex, berlaku 10 menit, sekali pakai. URL: scope `openid
      email https://www.googleapis.com/auth/gmail.send`, `access_type=offline`, `prompt=consent`,
      `login_hint` = `email_hint`.
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/email-accounts/google/oauth-url
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/OAuthUrlInput' }
          example: { email_hint: marketing@indobraga.com }
    responses:
      '201':
        description: Dibuat (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/OAuthUrlResult' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx, state_expires_at: 2026-05-12T08:40:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/oauth/google/email/callback:
  get:
    operationId: googleOAuthCallback
    tags: [emailaccounts]
    summary: Callback OAuth Google (redirect)
    description: |
      Selalu 302 ke `<PUBLIC_SITE_URL>/admin/email-accounts?connected=google&status=success|error`
      (+ `&reason=oauth_denied|missing_code|invalid_state|provider_failed` bila error), tanpa envelope.
      `error` terisi → state dikonsumsi, reason `oauth_denied`; `code` kosong → `missing_code`; state
      tidak valid/kedaluwarsa/terpakai → `invalid_state`; pertukaran token gagal → `provider_failed`.
      Hanya `state` yang wajib (tidak ada → 400 `VALIDATION_ERROR` JSON).
      
      **Parameter tak dikenal WAJIB diabaikan** (`x-unknown-query: ignore`): Google selalu menambahkan
      `scope`, dan sering `authuser`, `prompt`, `hd`, `iss`, dst. Legacy memakai `forbidNonWhitelisted`
      pada `GoogleOAuthCallbackQueryDto` sehingga parameter tersebut menghasilkan 400 `VALIDATION_ERROR`
      (`property scope should not exist`) alih-alih redirect — alur Google sungguhan gagal di legacy
      (e2e legacy hanya mengirim `code` & `state`). v1 menoleransinya.
    x-module: emailaccounts
    x-permission: null
    x-rate-limit: default
    x-cache-control: no-store
    x-unknown-query: ignore
    x-legacy:
      method: GET
      path: /api/v1/oauth/google/email/callback
      changes: "302 redirect tanpa envelope (sama). Parameter query tak dikenal diabaikan; legacy menolak dengan 400 VALIDATION_ERROR (forbidNonWhitelisted) sehingga callback Google asli gagal."
    security: []
    parameters:
      - name: code
        in: query
        required: false
        description: Kode otorisasi Google.
        schema: { type: string, maxLength: 2000 }
      - name: state
        in: query
        required: true
        schema: { type: string, maxLength: 4000 }
      - name: error
        in: query
        required: false
        description: Dikirim Google bila user menolak (mis. `access_denied`).
        schema: { type: string, maxLength: 500 }
      - name: scope
        in: query
        required: false
        description: Dikirim Google; diabaikan.
        schema: { type: string }
      - name: authuser
        in: query
        required: false
        description: Dikirim Google; diabaikan.
        schema: { type: string }
      - name: prompt
        in: query
        required: false
        description: Dikirim Google; diabaikan.
        schema: { type: string }
      - name: hd
        in: query
        required: false
        description: Domain Google Workspace; diabaikan.
        schema: { type: string }
      - name: iss
        in: query
        required: false
        description: Issuer (RFC 9207); diabaikan.
        schema: { type: string }
    responses:
      '200':
        description: TIDAK PERNAH dikirim — hanya pemenuh aturan lint `operation-2xx-response`; respons nyata selalu 302.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Location: { schema: { type: string, format: uri } }
        content:
          text/plain:
            schema: { type: string }
            example: Found. Redirecting to /admin/email-accounts?connected=google&status=success
      '302':
        description: Redirect ke halaman admin email-accounts.
        headers:
          Location: { schema: { type: string, format: uri } }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-accounts/smtp/test:
  post:
    operationId: testSmtpAccount
    tags: [emailaccounts]
    summary: Uji koneksi SMTP
    description: |
      Verifikasi kredensial SMTP (nodemailer `verify()`, timeout `SMTP_TEST_TIMEOUT_MS`) tanpa menyimpan.
      Gagal TIDAK error — 201 dengan `valid: false`. `smtp_security: none` di produksi selalu gagal
      ("SMTP tanpa enkripsi tidak boleh digunakan di production."). Mode mock: host/username/password
      mengandung "fail" → gagal.
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/email-accounts/smtp/test
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/SmtpAccountInput' }
          example: { email_address: marketing@indobraga.com, display_name: Marketing, smtp_host: mail.indobraga.com, smtp_port: 465, smtp_security: ssl_tls, smtp_username: marketing@indobraga.com, smtp_password: rahasia }
    responses:
      '201':
        description: Berhasil (201, paritas legacy).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/SmtpTestResult' }
            example: {"success": true, "message": "Data berhasil diambil.", "data": {"valid": true, "message": "Koneksi SMTP berhasil."}}
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
