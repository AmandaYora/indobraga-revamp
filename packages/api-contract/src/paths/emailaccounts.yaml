/api/v1/admin/email-accounts/{id}:
  patch:
    operationId: updateEmailAccount
    tags: [emailaccounts]
    summary: Ubah akun email
    description: Akun Google hanya display_name/status (400 bila lain); perubahan SMTP memicu re-verify → CONNECTED.
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: PATCH
      path: /api/v1/admin/email-accounts/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/UpdateEmailAccountInput' }
          example: { display_name: Marketing Baru }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/EmailAccount' }
            example:
              success: true
              message: Data berhasil diubah.
              data: { id: 1, provider: smtp, email_address: marketing@indobraga.com, display_name: Marketing Baru, status: connected, smtp_host: mail.indobraga.com, smtp_port: 465, smtp_security: ssl_tls, smtp_username: marketing@indobraga.com, last_validated_at: 2026-05-12T08:30:00.000Z, connected_at: 2026-05-12T08:30:00.000Z, last_error: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  delete:
    operationId: deleteEmailAccount
    tags: [emailaccounts]
    summary: Hapus akun email
    description: Hard-delete; 422 bila masih dirujuk kampanye (FK Restrict).
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: DELETE
      path: /api/v1/admin/email-accounts/{id}
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/DeleteEmailAccountResult' }
            example:
              success: true
              message: Data berhasil dihapus.
              data: { id: 1, status: deleted }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
