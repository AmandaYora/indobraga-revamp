# Fragmen email-accounts — 9 endpoint (termasuk callback OAuth).
/api/v1/admin/email-accounts:
  get:
    operationId: listEmailAccounts
    tags: [emailaccounts]
    summary: Daftar akun email
    description: Secret tidak pernah dikembalikan.
    x-module: emailaccounts
    x-permission: email_accounts.read
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/admin/email-accounts
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [] }]
    parameters:
      - name: page
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, default: 10, maximum: 100 }
      - name: q
        in: query
        required: false
        schema: { type: string }
      - name: provider
        in: query
        required: false
        schema: { type: string, enum: [google, smtp] }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [connected, invalid, disabled, needs_reconnect] }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data, meta]
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/email.yaml#/EmailAccount' } }
                    meta: { $ref: '../components/schemas/envelope.yaml#/PaginationMeta' }
            example:
              success: true
              message: Data berhasil diambil.
              data: [{ id: 1, provider: smtp, email_address: marketing@indobraga.com, display_name: Marketing, status: connected, smtp_host: mail.indobraga.com, smtp_port: 465, smtp_security: ssl_tls, smtp_username: marketing@indobraga.com, last_validated_at: 2026-05-12T08:30:00.000Z, connected_at: 2026-05-12T08:30:00.000Z, last_error: null, created_at: 2026-05-12T08:30:00.000Z, updated_at: 2026-05-12T08:30:00.000Z }]
              meta: { page: 1, limit: 10, total: 1, total_pages: 1 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-accounts/google/oauth-url:
  post:
    operationId: getGoogleOAuthUrl
    tags: [emailaccounts]
    summary: Buat URL OAuth Google
    description: State base64url(JSON{nonce,admin_user_id,exp}).HMAC, disimpan sha256 hex, 10 menit sekali pakai.
    x-module: emailaccounts
    x-permission: email_accounts.manage
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: POST
      path: /api/v1/admin/email-accounts/google/oauth-url
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/OAuthUrlInput' }
          example: { email_hint: marketing@indobraga.com }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/OAuthUrlResult' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx, state_expires_at: 2026-05-12T08:40:00.000Z }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/oauth/google/email/callback:
  get:
    operationId: googleOAuthCallback
    tags: [emailaccounts]
    summary: Callback OAuth Google (redirect)
    description: 302 ke ${PUBLIC_SITE_URL}/admin/email-accounts?connected=google&status=success|error&reason=oauth_denied|missing_code|invalid_state|provider_failed.
    x-module: emailaccounts
    x-permission: null
    x-rate-limit: default
    x-cache-control: no-store
    x-legacy:
      method: GET
      path: /api/v1/oauth/google/email/callback
      changes: Sama persis (302 redirect tanpa envelope).
    security: []
    parameters:
      - name: code
        in: query
        required: false
        schema: { type: string, maxLength: 2000 }
      - name: state
        in: query
        required: true
        schema: { type: string, maxLength: 4000 }
      - name: error
        in: query
        required: false
        schema: { type: string, maxLength: 500 }
    responses:
      '200':
        description: Redirect OAuth (didokumentasikan sebagai 302; 200 dicantumkan agar memenuhi lint 2xx).
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Location: { schema: { type: string, format: uri } }
        content:
          text/plain:
            schema: { type: string }
            example: Found. Redirecting to /admin/email-accounts?connected=google&status=success
      '302':
        description: Redirect ke halaman admin email-accounts.
        headers:
          Location: { schema: { type: string, format: uri } }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/admin/email-accounts/smtp/test:
  post:
    operationId: testSmtpAccount
    tags: [emailaccounts]
    summary: Uji koneksi SMTP
    description: verify() dengan timeout SMTP_TEST_TIMEOUT_MS; security none ditolak di produksi.
