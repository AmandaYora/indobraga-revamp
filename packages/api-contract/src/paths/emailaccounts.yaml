      method: POST
      path: /api/v1/admin/email-accounts/smtp/test
      changes: Tidak ada perubahan bentuk data selain envelope v1.
    security: [{ sessionCookie: [], csrfHeader: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/email.yaml#/SmtpAccountInput' }
          example: { email_address: marketing@indobraga.com, display_name: Marketing, smtp_host: mail.indobraga.com, smtp_port: 465, smtp_security: ssl_tls, smtp_username: marketing@indobraga.com, smtp_password: rahasia }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/email.yaml#/SmtpTestResult' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { valid: true, message: Koneksi SMTP berhasil. }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
