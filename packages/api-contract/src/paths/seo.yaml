# Fragmen seo — robots, sitemap, seo legacy alias + endpoint baru seo by path.
/robots.txt:
  get:
    operationId: getRobotsTxt
    tags: [site]
    summary: Ambil robots.txt
    description: |
      `Content-Type: text/plain; charset=utf-8`, tanpa envelope. Isi persis (baris dipisah `\n`, diakhiri `\n`; `<PUBLIC_SITE_URL>` tanpa `/` akhir).
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy:
      method: GET
      path: /robots.txt
      changes: "Sama persis (text/plain, tanpa envelope)."
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          text/plain:
            schema: { type: string }
            example: "User-agent: *\nAllow: /\nDisallow: /admin\nDisallow: /login\nDisallow: /api/\nDisallow: /internal/\n\nSitemap: https://indobraga.com/sitemap.xml\n"
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/sitemap.xml:
  get:
    operationId: getSitemapXml
    tags: [site]
    summary: Ambil sitemap.xml
    description: |
      `Content-Type: application/xml; charset=utf-8`, tanpa envelope. Baris dipisah `\n` dengan indent 2/4
      spasi, diakhiri `\n`. Urutan: `/` (priority 1.0), `/portfolio`, `/fasilitas` (0.8), `/galeri`,
      `/berita`, `/kontak` (0.7) — tanpa `lastmod` — lalu setiap berita `published` (published_at desc,
      id desc) `/berita/<slug>` dengan `lastmod` = `updated_at` ISO dan priority 0.6. `loc` di-escape XML.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy:
      method: GET
      path: /sitemap.xml
      changes: Sama persis (application/xml, tanpa envelope).
    security: []
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
          Cache-Control: { $ref: '../components/headers.yaml#/CacheControl' }
        content:
          application/xml:
            schema: { type: string }
            example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url>\n    <loc>https://indobraga.com/</loc>\n    <priority>1.0</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/portfolio</loc>\n    <priority>0.8</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/fasilitas</loc>\n    <priority>0.8</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/galeri</loc>\n    <priority>0.7</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/berita</loc>\n    <priority>0.7</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/kontak</loc>\n    <priority>0.7</priority>\n  </url>\n  <url>\n    <loc>https://indobraga.com/berita/tips-memilih-kemasan</loc>\n    <lastmod>2026-05-12T08:30:00.000Z</lastmod>\n    <priority>0.6</priority>\n  </url>\n</urlset>\n"
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/seo/{route}:
  get:
    operationId: getPublicSeoByRoute
    tags: [site]
    summary: Ambil SEO legacy per route (alias)
    description: |
      Alias legacy; frontend baru memakai `GET /public/seo?path`. `route` di-trim & dibuang `/` di
      ujung (kosong → `home`): `home|portfolio|fasilitas|galeri|berita|kontak|berita:<slug>`. Route lain →
      404 "SEO route tidak ditemukan."; berita tidak ada → 404 "Berita tidak ditemukan."; pengaturan
      situs belum ada → 404 "Pengaturan website belum tersedia.". `home` = seo_title ?? brand /
      seo_description ?? legal_name; route lain memakai judul/deskripsi tetap berakhiran `- <brand>`.
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy:
      method: GET
      path: /api/v1/public/seo/{route}
      changes: Dipertahankan sebagai alias; tidak ada perubahan bentuk data selain envelope v1.
    security: []
    parameters:
      - name: route
        in: path
        required: true
        description: Maks 190 karakter (legacy `SeoRouteParamDto`; lebih → 400 `VALIDATION_ERROR`).
        schema: { type: string, maxLength: 190 }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/SeoLegacy' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { title: Indobraga — Cetak Kemasan, description: Jasa cetak kemasan., canonical_url: https://indobraga.com/, og_image_url: null, noindex: false }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
/api/v1/public/seo:
  get:
    operationId: getPublicSeoByPath
    tags: [site]
    summary: Ambil SEO SPA per path (baru)
    description: Endpoint baru untuk SPA (menggantikan /public/seo/:route yang tidak dipakai frontend legacy).
    x-module: site
    x-permission: null
    x-rate-limit: default
    x-cache-control: public, max-age=300, stale-while-revalidate=600
    x-legacy: null
    security: []
    parameters:
      - name: path
        in: query
        required: true
        description: Path SPA, mis. /berita/tips-memilih-kemasan.
        schema: { type: string, maxLength: 500 }
    responses:
      '200':
        description: Berhasil.
        headers:
          X-Request-Id: { $ref: '../components/headers.yaml#/XRequestId' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/envelope.yaml#/SuccessBase'
                - type: object
                  required: [data]
                  properties:
                    data: { $ref: '../components/schemas/site.yaml#/SeoByPath' }
            example:
              success: true
              message: Data berhasil diambil.
              data: { title: Tips Memilih Kemasan — Indobraga, description: Ringkasan., canonical_url: https://indobraga.com/berita/tips-memilih-kemasan, robots: 'index, follow', og: { title: Tips, description: Ringkasan., image: null, url: https://indobraga.com/berita/tips-memilih-kemasan }, twitter: { card: summary_large_image, title: Tips, description: Ringkasan., image: null }, json_ld: [], status: 200 }
      '400': { $ref: '../components/responses.yaml#/ValidationError' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
