  /api/v1/oauth/google/email/callback:
    get:
      operationId: googleOAuthCallback
      tags:
        - emailaccounts
      summary: Callback OAuth Google (redirect)
      description: |
        Selalu 302 ke `<PUBLIC_SITE_URL>/admin/email-accounts?connected=google&status=success|error`
        (+ `&reason=oauth_denied|missing_code|invalid_state|provider_failed` bila error), tanpa envelope.
        `error` terisi → state dikonsumsi, reason `oauth_denied`; `code` kosong → `missing_code`; state
        tidak valid/kedaluwarsa/terpakai → `invalid_state`; pertukaran token gagal → `provider_failed`.
        Hanya `state` yang wajib (tidak ada → 400 `VALIDATION_ERROR` JSON).

        **Parameter tak dikenal WAJIB diabaikan** (`x-unknown-query: ignore`): Google selalu menambahkan
        `scope`, dan sering `authuser`, `prompt`, `hd`, `iss`, dst. Legacy memakai `forbidNonWhitelisted`
        pada `GoogleOAuthCallbackQueryDto` sehingga parameter tersebut menghasilkan 400 `VALIDATION_ERROR`
        (`property scope should not exist`) alih-alih redirect — alur Google sungguhan gagal di legacy
        (e2e legacy hanya mengirim `code` & `state`). v1 menoleransinya.
      x-module: emailaccounts
      x-permission: null
      x-rate-limit: default
      x-cache-control: no-store
      x-unknown-query: ignore
      x-legacy:
        method: GET
        path: /api/v1/oauth/google/email/callback
        changes: 302 redirect tanpa envelope (sama). Parameter query tak dikenal diabaikan; legacy menolak dengan 400 VALIDATION_ERROR (forbidNonWhitelisted) sehingga callback Google asli gagal.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Kode otorisasi Google.
          schema:
            type: string
            maxLength: 2000
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 4000
        - name: error
          in: query
          required: false
          description: Dikirim Google bila user menolak (mis. `access_denied`).
          schema:
            type: string
            maxLength: 500
        - name: scope
          in: query
          required: false
          description: Dikirim Google; diabaikan.
          schema:
            type: string
        - name: authuser
          in: query
          required: false
          description: Dikirim Google; diabaikan.
          schema:
            type: string
        - name: prompt
          in: query
          required: false
          description: Dikirim Google; diabaikan.
          schema:
            type: string
        - name: hd
          in: query
          required: false
          description: Domain Google Workspace; diabaikan.
          schema:
            type: string
        - name: iss
          in: query
          required: false
          description: Issuer (RFC 9207); diabaikan.
          schema:
            type: string
      responses:
        '200':
          description: TIDAK PERNAH dikirim — hanya pemenuh aturan lint `operation-2xx-response`; respons nyata selalu 302.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              schema:
                type: string
                format: uri
          content:
            text/plain:
              schema:
                type: string
              example: Found. Redirecting to /admin/email-accounts?connected=google&status=success
        '302':
          description: Redirect ke halaman admin email-accounts.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
