openapi: 3.1.0
info:
  title: Indobraga API
  version: 1.0.0
  summary: Kontrak API v1 Indobraga — company profile, dashboard admin, email marketing.
  description: |
    Sumber kebenaran antarmuka `apps/web` ↔ `apps/api` (ADR-0004). Spesifikasi perilaku: backend
    legacy NestJS (`../indobraga/apps/api/src`); setiap penyimpangan tercatat di `x-legacy.changes`
    dan/atau BC di ADR-0012.

    - Semua endpoint JSON berada di bawah `/api/v1`; `robots.txt` & `sitemap.xml` di root.
    - Envelope sukses: `{ success: true, message, data }` (+ `meta` untuk list).
    - Envelope error: `{ success: false, code, message, errors[], request_id }`.
    - Setiap respons membawa header `X-Request-Id`.
    - Ekstensi per operasi: `x-module`, `x-permission`, `x-rate-limit`, `x-cache-control`, `x-legacy`;
      opsional `x-body-limit-bytes`, `x-unknown-query`.

    **Status HTTP (paritas legacy).** `POST` sukses → **201** (default NestJS tanpa `@HttpCode`),
    kecuali `POST /auth/login` dan `POST /auth/logout` → 200. `GET`/`PATCH`/`DELETE` sukses → 200.

    **Urutan pemeriksaan.** rate limit (429) → sesi (401) → permission (403) → CSRF untuk method
    non-aman (403) → validasi path/query/body (400) → aturan bisnis. Guard legacy berjalan sebelum
    ValidationPipe, sehingga request tanpa sesi ke endpoint admin selalu 401 walau parameternya
    tidak valid.

    **Validasi (legacy `ValidationPipe`: `whitelist`, `forbidNonWhitelisted`, `transform`,
    `enableImplicitConversion`).** String bertanda "di-trim" dipangkas sebelum divalidasi.
    Path `{id}` bukan bilangan bulat ≥ 1 → 400 `VALIDATION_ERROR` (kecuali route arsip/batal-arsip
    konten → `BAD_REQUEST`, lihat parameter `ArchiveIdPath`). `page`/`limit` di luar batas → 400
    `VALIDATION_ERROR` (tidak di-clamp), kecuali operasi yang menyatakan clamping di deskripsinya.
    Field body di luar skema → 400 `VALIDATION_ERROR` (`errors[].field` = nama field, pesan
    `property <nama> should not exist`). `IsOptional` legacy juga menerima `null`: field yang
    bertipe nullable di kontrak memakai `null` untuk mengosongkan kolom. Legacy mengonversi nilai
    primitif ke tipe DTO sebelum validasi (`enableImplicitConversion`, mis. `"5"` → 5, 123 →
    `"123"`); kontrak mendeklarasikan tipe JSON kanonik dan klien wajib mengirim tipe tersebut.

    **Parameter query tak dikenal.** Operasi yang mendeklarasikan ≥ 1 parameter `in: query`
    (legacy: handler dengan `@Query() dto`) menolak parameter query lain → 400 `VALIDATION_ERROR`
    (pesan `property <nama> should not exist`). Operasi tanpa parameter query (legacy: tanpa
    `@Query()`) mengabaikan seluruh query string. Pengecualian ditandai `x-unknown-query: ignore`
    (callback OAuth Google — wajib menoleransi `scope`, `authuser`, `prompt`, `hd`, `iss`, dst.).

    **Batas body.** Body JSON maksimum 1 MB (1.048.576 byte) kecuali operasi dengan
    `x-body-limit-bytes` (draf kampanye manual & ubah kampanye: 5 MB, BC-06). Melebihi batas →
    413 `PAYLOAD_TOO_LARGE` berenvelope. Legacy: batas default Express 100 KB dan error body-parser
    tidak berenvelope (BC-06). Upload media multipart: batas 100 MB (lihat `uploadMedia`).
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /
    description: Same-origin (Vite proxy di dev, satu container di produksi)
security: []
tags:
  - name: auth
    description: Login, logout, sesi admin
  - name: users
    description: Manajemen user admin
  - name: health
    description: Health check
  - name: dashboard
    description: Ringkasan dashboard admin
  - name: site
    description: Orkestrasi publik — beranda, fasilitas, SEO, robots, sitemap
  - name: settings
    description: Pengaturan situs
  - name: profile
    description: Hero, partner, keunggulan, mesin, kapasitas, layanan
  - name: portfolio
    description: Portofolio & kategori
  - name: gallery
    description: Galeri
  - name: news
    description: Berita
  - name: media
    description: Upload & pustaka media
  - name: leads
    description: Pesan kontak & prospek WhatsApp
  - name: audience
    description: Kontak marketing
  - name: notifications
    description: Notifikasi admin & SSE
  - name: emailaccounts
    description: Akun email Google & SMTP
  - name: emailtemplates
    description: Template email
  - name: campaigns
    description: Kampanye email & worker
paths:
  /api/v1/admin/audience/contacts:
    get:
      operationId: listAudienceContacts
      tags:
        - audience
      summary: Daftar kontak marketing
      description: |
        List offset, urut last_interaction_at desc, created_at desc, id desc. `limit` > 100 TIDAK ditolak — di-clamp ke 100 (`meta.limit` = 100; legacy `ListAudienceQueryDto` tanpa `@Max`).
      x-module: audience
      x-permission: audience.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/contacts
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Bilangan bulat ≥ 1; nilai > 100 di-clamp menjadi 100.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: q
          in: query
          required: false
          description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MarketingContact'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  - id: 1
                    name: Budi
                    email: budi@contoh.com
                    phone: '08123456789'
                    company: null
                    source: inquiry
                    source_ref_id: 1
                    status: active
                    consent_status: implied
                    last_interaction_at: '2026-05-12T08:30:00.000Z'
                    created_at: '2026-05-12T08:30:00.000Z'
                    updated_at: '2026-05-12T08:30:00.000Z'
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/audience/export.csv:
    get:
      operationId: exportAudienceCsv
      tags:
        - audience
      summary: Ekspor audiens CSV
      description: |
        CSV tanpa envelope, maks 10.000 baris (urut last_interaction_at desc, created_at desc, id desc).
        Header respons: `Content-Type: text/csv; charset=utf-8`, `Content-Disposition: attachment;
        filename="indobraga-audience.csv"` (+ `Cache-Control: no-store`). Body: BOM UTF-8 (`\uFEFF`), baris
        dipisah CRLF (`\r\n`) termasuk setelah baris terakhir, setiap sel di-quote (`"` di-escape `""`).
        Kolom: Nama, Email, Telepon, Perusahaan, Sumber, Status, Consent, Interaksi Terakhir, Dibuat
        (nilai enum lowercase; tanggal ISO 8601 UTC lengkap; null → string kosong).
      x-module: audience
      x-permission: audience.export
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/export.csv
        changes: Sama persis (text/csv tanpa envelope).
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: File CSV.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Type:
              schema:
                type: string
                const: text/csv; charset=utf-8
            Content-Disposition:
              schema:
                type: string
                const: attachment; filename="indobraga-audience.csv"
          content:
            text/csv:
              schema:
                type: string
              example: "\uFEFF\"Nama\",\"Email\",\"Telepon\",\"Perusahaan\",\"Sumber\",\"Status\",\"Consent\",\"Interaksi Terakhir\",\"Dibuat\"\r\n\"Budi\",\"budi@contoh.com\",\"08123456789\",\"\",\"inquiry\",\"active\",\"implied\",\"2026-05-12T08:30:00.000Z\",\"2026-05-12T08:30:00.000Z\"\r\n"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/audience/preview:
    get:
      operationId: previewAudience
      tags:
        - audience
      summary: Pratinjau audiens
      description: |
        Ringkasan audiens untuk draf kampanye. Filter `status` divalidasi tetapi diabaikan (total dihitung dari `q`/`source`; eligible = kontak `active`).
      x-module: audience
      x-permission: audience.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/preview
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Di-trim (maks 120 setelah trim); mencari name, email, phone, company.
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AudiencePreview'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  total_contacts: 10
                  eligible_recipients: 8
                  excluded_unsubscribed: 1
                  excluded_blocked: 1
                  sample_recipients:
                    - id: 1
                      name: Budi
                      email: budi@contoh.com
                      company: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/dashboard:
    get:
      operationId: getDashboard
      tags:
        - dashboard
      summary: Ringkasan dashboard admin
      description: |
        Total + 5 inquiry, 5 prospek WhatsApp (belum diarsip) dan 5 kampanye terbaru dalam bentuk ringkas.
      x-module: dashboard
      x-permission: dashboard.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/dashboard
        changes: '`totals.pending_revalidation` dihapus (BC-12); selebihnya sama.'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardSummary'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  totals:
                    inquiries: 10
                    whatsapp_leads: 5
                    published_gallery: 9
                    published_news: 3
                    active_portfolios: 8
                    completed_media: 59
                    failed_media: 0
                    connected_email_accounts: 1
                    email_campaigns: 2
                    pending_email_campaigns: 0
                  latest_inquiries:
                    - id: 12
                      name: Budi Santoso
                      email: budi@contoh.com
                      phone: 0812-3456-789
                      company: null
                      status: new
                      created_at: '2026-05-12T08:30:00.000Z'
                  latest_whatsapp_leads:
                    - id: 3
                      name: Siti
                      phone: '08123456789'
                      status: new
                      created_at: '2026-05-12T08:30:00.000Z'
                  latest_email_campaigns:
                    - id: 1
                      title: Promo Lebaran
                      subject: Diskon Kemasan
                      status: completed
                      total_recipients: 10
                      sent_count: 9
                      failed_count: 1
                      created_at: '2026-05-12T08:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts:
    get:
      operationId: listEmailAccounts
      tags:
        - emailaccounts
      summary: Daftar akun email
      description: |
        List offset, urut created_at desc, id desc. `q` (di-trim) mencari email, display_name, smtp_host, smtp_username. Secret tidak pernah dikembalikan.
      x-module: emailaccounts
      x-permission: email_accounts.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/email-accounts
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 100
        - name: q
          in: query
          required: false
          description: Di-trim.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum:
              - google
              - smtp
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - connected
              - invalid
              - disabled
              - needs_reconnect
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmailAccount'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  - id: 1
                    provider: smtp
                    auth_type: smtp
                    email_address: marketing@indobraga.com
                    display_name: Marketing
                    status: connected
                    smtp_host: mail.indobraga.com
                    smtp_port: 465
                    smtp_security: ssl_tls
                    smtp_username: marketing@indobraga.com
                    last_validated_at: '2026-05-12T08:30:00.000Z'
                    connected_at: '2026-05-12T08:30:00.000Z'
                    last_error: null
                    created_at: '2026-05-12T08:30:00.000Z'
                    updated_at: '2026-05-12T08:30:00.000Z'
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/google/oauth-url:
    post:
      operationId: getGoogleOAuthUrl
      tags:
        - emailaccounts
      summary: Buat URL OAuth Google
      description: |
        Body opsional. State = base64url(JSON{nonce, admin_user_id, exp}) + "." + base64url(HMAC-SHA256
        SESSION_SECRET); disimpan sebagai sha256 hex, berlaku 10 menit, sekali pakai. URL: scope `openid
        email https://www.googleapis.com/auth/gmail.send`, `access_type=offline`, `prompt=consent`,
        `login_hint` = `email_hint`.
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/google/oauth-url
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthUrlInput'
            example:
              email_hint: marketing@indobraga.com
      responses:
        '201':
          description: Dibuat (201, paritas legacy).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthUrlResult'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx
                  state_expires_at: '2026-05-12T08:40:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/smtp:
    post:
      operationId: createSmtpAccount
      tags:
        - emailaccounts
      summary: Buat/upsert akun SMTP
      description: |
        Verifikasi dulu (gagal → 422 dengan pesan "<pesan> (<detail>)"), lalu upsert pada (provider smtp,
        email lowercase) → status `connected`. Akun SMTP dengan email sama diperbarui (bukan 409).
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/smtp
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpAccountInput'
            example:
              email_address: marketing@indobraga.com
              display_name: Marketing
              smtp_host: mail.indobraga.com
              smtp_port: 465
              smtp_security: ssl_tls
              smtp_username: marketing@indobraga.com
              smtp_password: rahasia
      responses:
        '201':
          description: Dibuat/diperbarui (201, paritas legacy).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/EmailAccount'
              example:
                success: true
                message: Data berhasil dibuat.
                data:
                  id: 1
                  provider: smtp
                  auth_type: smtp
                  email_address: marketing@indobraga.com
                  display_name: Marketing
                  status: connected
                  smtp_host: mail.indobraga.com
                  smtp_port: 465
                  smtp_security: ssl_tls
                  smtp_username: marketing@indobraga.com
                  last_validated_at: '2026-05-12T08:30:00.000Z'
                  connected_at: '2026-05-12T08:30:00.000Z'
                  last_error: null
                  created_at: '2026-05-12T08:30:00.000Z'
                  updated_at: '2026-05-12T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/smtp/test:
    post:
      operationId: testSmtpAccount
      tags:
        - emailaccounts
      summary: Uji koneksi SMTP
      description: |
        Verifikasi kredensial SMTP (nodemailer `verify()`, timeout `SMTP_TEST_TIMEOUT_MS`) tanpa menyimpan.
        Gagal TIDAK error — 201 dengan `valid: false`. `smtp_security: none` di produksi selalu gagal
        ("SMTP tanpa enkripsi tidak boleh digunakan di production."). Mode mock: host/username/password
        mengandung "fail" → gagal.
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/smtp/test
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpAccountInput'
            example:
              email_address: marketing@indobraga.com
              display_name: Marketing
              smtp_host: mail.indobraga.com
              smtp_port: 465
              smtp_security: ssl_tls
              smtp_username: marketing@indobraga.com
              smtp_password: rahasia
      responses:
        '201':
          description: Berhasil (201, paritas legacy).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/SmtpTestResult'
              example:
