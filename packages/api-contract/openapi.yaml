        method: POST
        path: /api/v1/admin/media
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - usage
              properties:
                file:
                  type: string
                  format: binary
                  description: Gambar (≤10MB) atau video (≤100MB).
