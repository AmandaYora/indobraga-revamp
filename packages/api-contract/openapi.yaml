  responses:
    ValidationError:
      description: |
        Validasi gagal (`VALIDATION_ERROR`) — `errors[]` berisi field & pesan; field body/query asing
        ditolak (pesan legacy `property <nama> should not exist`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            code: VALIDATION_ERROR
            message: Periksa kembali data yang diisi.
            errors:
              - field: email
                message: Email tidak valid.
            request_id: req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
    Unauthenticated:
      description: Belum login atau sesi tidak valid (`UNAUTHENTICATED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Tidak punya izin, atau token CSRF tidak cocok (`FORBIDDEN`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Terlalu banyak request (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Aturan bisnis tidak terpenuhi (`UNPROCESSABLE_ENTITY`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Data tidak ditemukan (`NOT_FOUND`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidRequest:
      description: |
        Request tidak valid. `code` = `VALIDATION_ERROR` (path/query/body gagal validasi DTO, termasuk
        parameter query tak dikenal) atau `BAD_REQUEST` (aturan status/bisnis — lihat deskripsi operasi).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              summary: Validasi gagal
              value:
                success: false
                code: VALIDATION_ERROR
                message: Periksa kembali data yang diisi.
                errors:
                  - field: id
                    message: id harus berupa angka bulat.
                request_id: req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
            bad_request:
              summary: Aturan status/bisnis
              value:
                success: false
                code: BAD_REQUEST
                message: Konten ini sudah berada di arsip.
                errors: []
                request_id: req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
    Conflict:
      description: Konflik data — duplikat atau masih dipakai (`CONFLICT` atau kode domain).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: |
        Ukuran request/file melebihi batas (`PAYLOAD_TOO_LARGE`) — body JSON di atas `x-body-limit-bytes`
        operasi (default 1 MB) atau file upload di atas batas media.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationOrMediaNotReady:
      description: |
        Request tidak valid (HTTP 400). `code` = `VALIDATION_ERROR` (validasi DTO atau bagian wajib
        kosong — "Lengkapi bagian wajib: …") atau `UNPROCESSABLE_ENTITY` bila media yang dirujuk tidak
        ada / belum `completed` ("Media belum siap dipakai. Tunggu proses selesai atau unggah media
        lain."). Status 400 untuk media belum siap adalah paritas legacy (`assertCompletedMedia`,
        admin-content.service.ts:1784-1796 melempar `BadRequestException` ber-code `UNPROCESSABLE_ENTITY`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              summary: Validasi gagal
              value:
                success: false
                code: VALIDATION_ERROR
                message: 'Lengkapi bagian wajib: judul.'
                errors: []
                request_id: req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
            media_not_ready:
              summary: Media belum completed
              value:
                success: false
                code: UNPROCESSABLE_ENTITY
                message: Media belum siap dipakai. Tunggu proses selesai atau unggah media lain.
                errors: []
                request_id: req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
    InternalError:
      description: Kesalahan server (`INTERNAL_ERROR`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Request tidak valid (`BAD_REQUEST`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Tipe file tidak didukung (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Dependensi utama tidak tersedia (`SERVICE_UNAVAILABLE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID numerik. Bukan bilangan bulat ≥ 1 → 400 `VALIDATION_ERROR` (legacy `IdParamDto`).
      schema:
        type: integer
        format: int64
        minimum: 1
    ArchiveIdPath:
      name: id
      in: path
      required: true
      description: |
        ID numerik untuk route arsip/batal-arsip konten. Legacy memakai `ParseIntPipe`
        (admin-content.controller.ts:549-565): bukan bilangan bulat → 400 `BAD_REQUEST`
        (pesan default "Permintaan belum bisa diproses."); 0/negatif lolos lalu → 404 `NOT_FOUND`.
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Cursor opaque dari `meta.next_cursor` respons sebelumnya (base64url JSON `{sort_order, id}`).
        Tidak bisa di-decode atau bukan `{sort_order: number, id: number}` → 400 `BAD_REQUEST`
        ("Cursor tidak valid."). Tanpa batas panjang (legacy `IsString`).
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Halaman (mulai 1). Bukan bilangan bulat ≥ 1 → 400 `VALIDATION_ERROR`; tidak dikirim → 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    SlugPath:
      name: slug
      in: path
      required: true
      description: Tidak cocok pola → 400 `VALIDATION_ERROR` (legacy `SlugParamDto`, tanpa batas panjang).
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
