components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: indobraga_session
      description: Cookie sesi admin (httpOnly, SameSite=Lax, Secure di produksi). Nama dapat diubah lewat `SESSION_COOKIE_NAME`.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Double-submit CSRF — nilai cookie `indobraga_csrf` (non-httpOnly) dikirim ulang di header ini untuk method non-aman.
    workerSecret:
      type: apiKey
      in: header
      name: x-internal-worker-secret
      description: Secret untuk endpoint tick worker internal (`INTERNAL_WORKER_SECRET`).
  headers:
    XRequestId:
      description: Request ID (selalu ada di setiap respons).
      schema:
        type: string
    RetryAfter:
      description: Detik yang harus ditunggu sebelum mencoba lagi (pada 429).
      schema:
        type: integer
    XRateLimitLimit:
      description: Kuota request dalam jendela rate limit.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Sisa kuota dalam jendela saat ini.
      schema:
        type: integer
    XRateLimitReset:
      description: Detik sampai jendela rate limit direset.
      schema:
        type: integer
    SetCookie:
      description: Cookie sesi (httpOnly) dan/atau cookie CSRF (non-httpOnly).
      schema:
        type: string
  schemas:
    SuccessBase:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          description: Pesan sukses berbahasa Indonesia, mis. "Data berhasil diambil."
          examples:
            - Data berhasil diambil.
    Id:
      type: integer
      format: int64
      minimum: 1
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC dengan milidetik, mis. `2026-05-12T08:30:00.000Z`.
      examples:
        - '2026-05-12T08:30:00.000Z'
    MarketingContact:
      type: object
      required:
        - id
        - email
        - source
        - status
        - consent_status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type:
            - string
            - 'null'
        email:
          type: string
          format: email
        phone:
          type:
            - string
            - 'null'
        company:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - inquiry
            - whatsapp_lead
            - manual_import
            - manual
        source_ref_id:
          type:
            - integer
            - 'null'
        status:
          type: string
          enum:
            - active
            - unsubscribed
            - blocked
        consent_status:
          type: string
          enum:
            - implied
            - explicit
            - unknown
        last_interaction_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          examples:
            - 1
        limit:
          type: integer
          minimum: 1
          examples:
            - 10
        total:
          type: integer
          minimum: 0
          examples:
            - 42
        total_pages:
          type: integer
          minimum: 1
          description: '`max(1, ceil(total / limit))`'
          examples:
            - 5
    ErrorCode:
      type: string
      description: |
        Kode error mesin. 13 kode inti (paritas legacy) + kode domain (BC-04).
        UI bergantung pada kode ini (mis. `UNAUTHENTICATED` → redirect ke /login).
      enum:
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - UNPROCESSABLE_ENTITY
        - RATE_LIMITED
        - INTERNAL_ERROR
        - UPSTREAM_ERROR
        - SERVICE_UNAVAILABLE
        - MEDIA_CLEANUP_FAILED
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type:
            - string
            - 'null'
          description: Path field bertitik, mis. `recipients.0.email`. Null untuk error non-field.
          examples:
            - email
        message:
          type: string
          description: Pesan Indonesia, memakai label field (mis. "Email wajib diisi.").
    ErrorEnvelope:
      type: object
      required:
        - success
        - code
        - message
        - errors
        - request_id
      properties:
        success:
          type: boolean
          const: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Pesan Indonesia yang aman ditampilkan ke user.
          examples:
            - Periksa kembali data yang diisi.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          examples:
            - req_4b5d9d6e-7d3a-4d3f-9a55-0c5b4f0c2f31
    AudiencePreview:
      type: object
      required:
        - total_contacts
        - eligible_recipients
        - excluded_unsubscribed
        - excluded_blocked
        - sample_recipients
      properties:
        total_contacts:
          type: integer
          minimum: 0
        eligible_recipients:
          type: integer
          minimum: 0
        excluded_unsubscribed:
          type: integer
          minimum: 0
        excluded_blocked:
          type: integer
          minimum: 0
        sample_recipients:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MarketingContact'
    LeadStatus:
      type: string
      enum:
        - new
        - contacted
        - in_progress
        - closed
        - spam
    Inquiry:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - message
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type:
            - string
            - 'null'
        message:
          type: string
        status:
          $ref: '#/components/schemas/LeadStatus'
        internal_note:
          type:
            - string
            - 'null'
        notification_status:
          type:
            - string
            - 'null'
          examples:
            - pending
        source:
          type:
            - string
            - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsAppLead:
      type: object
      required:
        - id
        - name
        - phone
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        phone:
          type: string
        message:
          type:
            - string
            - 'null'
        generated_message:
          type:
