              example: |
                User-agent: *
                Allow: /
                Disallow: /admin
                Disallow: /login
                Disallow: /api/
                Disallow: /internal/

                Sitemap: https://indobraga.com/sitemap.xml
        '429':
          $ref: '#/components/responses/RateLimited'
  /sitemap.xml:
    get:
      operationId: getSitemapXml
      tags:
        - site
      summary: Ambil sitemap.xml
      description: |
        `Content-Type: application/xml; charset=utf-8`, tanpa envelope. Baris dipisah `\n` dengan indent 2/4
        spasi, diakhiri `\n`. Urutan: `/` (priority 1.0), `/portfolio`, `/fasilitas` (0.8), `/galeri`,
        `/berita`, `/kontak` (0.7) — tanpa `lastmod` — lalu setiap berita `published` (published_at desc,
        id desc) `/berita/<slug>` dengan `lastmod` = `updated_at` ISO dan priority 0.6. `loc` di-escape XML.
      x-module: site
      x-permission: null
      x-rate-limit: default
      x-cache-control: public, max-age=300, stale-while-revalidate=600
      x-legacy:
        method: GET
        path: /sitemap.xml
        changes: Sama persis (application/xml, tanpa envelope).
      security: []
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                  <url>
                    <loc>https://indobraga.com/</loc>
                    <priority>1.0</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/portfolio</loc>
                    <priority>0.8</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/fasilitas</loc>
                    <priority>0.8</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/galeri</loc>
                    <priority>0.7</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/berita</loc>
                    <priority>0.7</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/kontak</loc>
                    <priority>0.7</priority>
                  </url>
                  <url>
                    <loc>https://indobraga.com/berita/tips-memilih-kemasan</loc>
                    <lastmod>2026-05-12T08:30:00.000Z</lastmod>
                    <priority>0.6</priority>
                  </url>
                </urlset>
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: indobraga_admin_session
      description: |
        Cookie sesi admin (httpOnly, SameSite=Lax, Path=/, Secure hanya di produksi, Max-Age =
        `ADMIN_SESSION_TTL_DAYS` hari). Nama default `indobraga_admin_session` = default legacy
        `config/env.ts`; dapat diubah lewat `SESSION_COOKIE_NAME`.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: |
        Double-submit CSRF — nilai cookie `indobraga_csrf` (`CSRF_COOKIE_NAME`, default legacy;
        non-httpOnly) dikirim ulang di header ini untuk method non-aman pada endpoint yang butuh
        sesi. Cookie/header kosong atau berbeda → 403 `FORBIDDEN` ("Halaman sudah kedaluwarsa.
        Muat ulang halaman lalu coba lagi.").
    workerSecret:
      type: apiKey
      in: header
      name: x-internal-worker-secret
      description: Secret untuk endpoint tick worker internal (`INTERNAL_WORKER_SECRET`).
  headers:
    XRequestId:
      description: Request ID (selalu ada di setiap respons).
      schema:
        type: string
    RetryAfter:
      description: Detik yang harus ditunggu sebelum mencoba lagi (pada 429).
      schema:
        type: integer
    XRateLimitLimit:
      description: Kuota request dalam jendela rate limit.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Sisa kuota dalam jendela saat ini.
      schema:
        type: integer
    XRateLimitReset:
      description: Detik sampai jendela rate limit direset.
      schema:
        type: integer
    SetCookie:
      description: |
        Dua header `Set-Cookie` (paritas legacy auth/cookie.utils.ts): cookie sesi
        `indobraga_admin_session` (`SESSION_COOKIE_NAME`; httpOnly, `SameSite=Lax`, `Path=/`,
        `Max-Age` = `ADMIN_SESSION_TTL_DAYS` hari, `Secure` hanya di produksi) dan cookie CSRF
        `indobraga_csrf` (`CSRF_COOKIE_NAME`; atribut sama tetapi TANPA httpOnly).
      schema:
        type: string
        examples:
          - indobraga_admin_session=Zm9v...; Max-Age=604800; Path=/; Expires=Tue, 19 May 2026 08:30:00 GMT; HttpOnly; SameSite=Lax
    ClearCookie:
      description: |
        Dua header `Set-Cookie` yang menghapus cookie sesi dan cookie CSRF (legacy `res.clearCookie`):
        nilai kosong, `Path=/`, `Expires=Thu, 01 Jan 1970 00:00:00 GMT`, `HttpOnly`, `SameSite=Lax`
        (+ `Secure` di produksi) — atribut yang sama dipakai untuk kedua cookie.
      schema:
        type: string
        examples:
          - indobraga_admin_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
    CacheControl:
      description: Nilai persis sama dengan ekstensi `x-cache-control` operasi.
      schema:
        type: string
  schemas:
    SuccessBase:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          description: Pesan sukses berbahasa Indonesia, mis. "Data berhasil diambil."
          examples:
            - Data berhasil diambil.
    Id:
      type: integer
      format: int64
      minimum: 1
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC dengan milidetik, mis. `2026-05-12T08:30:00.000Z`.
      examples:
        - '2026-05-12T08:30:00.000Z'
    MarketingContact:
