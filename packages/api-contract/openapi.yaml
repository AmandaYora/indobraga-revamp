  /api/v1/admin/printing-capacities:
    get:
      operationId: listPrintingCapacities
      tags:
        - profile
      summary: Daftar kapasitas cetak
      description: 'List offset (legacy `AdminListQueryDto`, default 10, maks 100). Urut sort_order asc, id asc. Pencarian `q`: label, description. Tanpa filter `status`, konten `archived` disembunyikan.'
      x-module: profile
      x-permission: content.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/printing-capacities
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Halaman (mulai 1). Bukan bilangan bulat ≥ 1 → 400 `VALIDATION_ERROR`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Batas per halaman; > 100 → 400 `VALIDATION_ERROR`.
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 100
        - name: q
          in: query
          required: false
          description: Kata kunci (di-trim; `contains`). Kolom yang dicari berbeda per resource.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter status. Tanpa filter, konten `archived` disembunyikan.
          schema:
            type: string
            enum:
              - draft
              - published
              - inactive
              - archived
        - name: category
          in: query
          required: false
          description: Di-trim. Hanya berpengaruh pada portofolio (teks/nama/slug kategori) dan berita (kategori persis); resource lain mengabaikan.
          schema:
            type: string
        - name: segment
          in: query
          required: false
          description: Di-trim. Hanya berpengaruh pada partner (segment persis); resource lain mengabaikan.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Hanya berpengaruh pada item galeri; resource lain mengabaikan.
          schema:
            type: string
            enum:
              - image
              - video
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrintingCapacity'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  - id: 1
                    label: Offset Printing
                    value: '50.000'
                    unit: lembar/hari
                    description: Cetak offset hingga B1.
                    media_file_id: null
                    media_file: null
                    sort_order: 1
                    status: published
                    previous_status: null
                    archived_at: null
                    created_at: '2026-05-12T08:30:00.000Z'
                    updated_at: '2026-05-12T08:30:00.000Z'
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
