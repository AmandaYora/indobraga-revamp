openapi: 3.1.0
info:
  title: Indobraga API
  version: 1.0.0
  summary: Kontrak API v1 Indobraga — company profile, dashboard admin, email marketing.
  description: |
    Sumber kebenaran antarmuka `apps/web` ↔ `apps/api` (ADR-0004).

    - Semua endpoint JSON berada di bawah `/api/v1`; `robots.txt` & `sitemap.xml` di root.
    - Envelope sukses: `{ success: true, message, data }` (+ `meta` untuk list).
    - Envelope error: `{ success: false, code, message, errors[], request_id }`.
    - Setiap respons membawa header `X-Request-Id`.
    - Ekstensi per operasi: `x-module`, `x-permission`, `x-rate-limit`, `x-cache-control`, `x-legacy`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /
    description: Same-origin (Vite proxy di dev, satu container di produksi)
security: []
tags:
  - name: auth
    description: Login, logout, sesi admin
  - name: users
    description: Manajemen user admin
  - name: health
    description: Health check
  - name: dashboard
    description: Ringkasan dashboard admin
  - name: site
    description: Orkestrasi publik — beranda, fasilitas, SEO, robots, sitemap
  - name: settings
    description: Pengaturan situs
  - name: profile
    description: Hero, partner, keunggulan, mesin, kapasitas, layanan
  - name: portfolio
    description: Portofolio & kategori
  - name: gallery
    description: Galeri
  - name: news
    description: Berita
  - name: media
    description: Upload & pustaka media
  - name: leads
    description: Pesan kontak & prospek WhatsApp
  - name: audience
    description: Kontak marketing
  - name: notifications
    description: Notifikasi admin & SSE
  - name: emailaccounts
    description: Akun email Google & SMTP
  - name: emailtemplates
    description: Template email
  - name: campaigns
    description: Kampanye email & worker
paths:
  /api/v1/admin/audience/contacts:
    get:
      operationId: listAudienceContacts
      tags:
        - audience
      summary: Daftar kontak marketing
      x-module: audience
      x-permission: audience.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/contacts
        changes: Tidak ada perubahan bentuk data selain envelope v1; limit di-clamp 100.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 100
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MarketingContact'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  - id: 1
                    name: Budi
                    email: budi@contoh.com
                    phone: '08123456789'
                    company: null
                    source: inquiry
                    source_ref_id: 1
                    status: active
                    consent_status: implied
                    last_interaction_at: '2026-05-12T08:30:00.000Z'
                    created_at: '2026-05-12T08:30:00.000Z'
                    updated_at: '2026-05-12T08:30:00.000Z'
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/audience/export.csv:
    get:
      operationId: exportAudienceCsv
      tags:
        - audience
      summary: Ekspor audiens CSV
      description: text/csv attachment indobraga-audience.csv; BOM UTF-8, CRLF, semua sel quoted; maks 10.000 baris.
      x-module: audience
      x-permission: audience.export
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/export.csv
        changes: Sama persis (text/csv tanpa envelope).
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: File CSV.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            text/csv:
              schema:
                type: string
              example: |
                "Nama","Email","Telepon","Perusahaan","Sumber","Status","Consent","Interaksi Terakhir","Dibuat"
                "Budi","budi@contoh.com","08123456789","","inquiry","active","implied","2026-05-12","2026-05-12"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/audience/preview:
    get:
      operationId: previewAudience
      tags:
        - audience
      summary: Pratinjau audiens
      x-module: audience
      x-permission: audience.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/audience/preview
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - inquiry
              - whatsapp_lead
              - manual_import
              - manual
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - unsubscribed
              - blocked
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AudiencePreview'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  total_contacts: 10
                  eligible_recipients: 8
                  excluded_unsubscribed: 1
                  excluded_blocked: 1
                  sample_recipients: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/dashboard:
    get:
      operationId: getDashboard
      tags:
        - dashboard
      summary: Ringkasan dashboard admin
      description: Total + 5 inquiry, 5 whatsapp-lead, 5 kampanye terbaru.
      x-module: dashboard
      x-permission: dashboard.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/dashboard
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardSummary'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  totals:
                    inquiries: 10
                    whatsapp_leads: 5
                    published_gallery: 9
                    published_news: 3
                    active_portfolios: 8
                    completed_media: 59
                    failed_media: 0
                    connected_email_accounts: 1
                    email_campaigns: 2
                    pending_email_campaigns: 0
                    pending_revalidation: 0
                  latest_inquiries: []
                  latest_whatsapp_leads: []
                  latest_email_campaigns: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts:
    get:
      operationId: listEmailAccounts
      tags:
        - emailaccounts
      summary: Daftar akun email
      description: Secret tidak pernah dikembalikan.
      x-module: emailaccounts
      x-permission: email_accounts.read
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: GET
        path: /api/v1/admin/email-accounts
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 100
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum:
              - google
              - smtp
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - connected
              - invalid
              - disabled
              - needs_reconnect
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmailAccount'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  - id: 1
                    provider: smtp
                    email_address: marketing@indobraga.com
                    display_name: Marketing
                    status: connected
                    smtp_host: mail.indobraga.com
                    smtp_port: 465
                    smtp_security: ssl_tls
                    smtp_username: marketing@indobraga.com
                    last_validated_at: '2026-05-12T08:30:00.000Z'
                    connected_at: '2026-05-12T08:30:00.000Z'
                    last_error: null
                    created_at: '2026-05-12T08:30:00.000Z'
                    updated_at: '2026-05-12T08:30:00.000Z'
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  total_pages: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/google/oauth-url:
    post:
      operationId: getGoogleOAuthUrl
      tags:
        - emailaccounts
      summary: Buat URL OAuth Google
      description: State base64url(JSON{nonce,admin_user_id,exp}).HMAC, disimpan sha256 hex, 10 menit sekali pakai.
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/google/oauth-url
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthUrlInput'
            example:
              email_hint: marketing@indobraga.com
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthUrlResult'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=xxx
                  state_expires_at: '2026-05-12T08:40:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/smtp:
    post:
      operationId: createSmtpAccount
      tags:
        - emailaccounts
      summary: Buat/upsert akun SMTP
      description: Verifikasi dulu (422 bila gagal), lalu upsert pada (provider, email).
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/smtp
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpAccountInput'
            example:
              email_address: marketing@indobraga.com
              display_name: Marketing
              smtp_host: mail.indobraga.com
              smtp_port: 465
              smtp_security: ssl_tls
              smtp_username: marketing@indobraga.com
              smtp_password: rahasia
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/EmailAccount'
              example:
                success: true
                message: Data berhasil dibuat.
                data:
                  id: 1
                  provider: smtp
                  email_address: marketing@indobraga.com
                  display_name: Marketing
                  status: connected
                  smtp_host: mail.indobraga.com
                  smtp_port: 465
                  smtp_security: ssl_tls
                  smtp_username: marketing@indobraga.com
                  last_validated_at: '2026-05-12T08:30:00.000Z'
                  connected_at: '2026-05-12T08:30:00.000Z'
                  last_error: null
                  created_at: '2026-05-12T08:30:00.000Z'
                  updated_at: '2026-05-12T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/smtp/test:
    post:
      operationId: testSmtpAccount
      tags:
        - emailaccounts
      summary: Uji koneksi SMTP
      description: verify() dengan timeout SMTP_TEST_TIMEOUT_MS; security none ditolak di produksi.
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/smtp/test
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpAccountInput'
            example:
              email_address: marketing@indobraga.com
              display_name: Marketing
              smtp_host: mail.indobraga.com
              smtp_port: 465
              smtp_security: ssl_tls
              smtp_username: marketing@indobraga.com
              smtp_password: rahasia
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/SmtpTestResult'
              example:
                success: true
                message: Data berhasil diambil.
                data:
                  valid: true
                  message: Koneksi SMTP berhasil.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/{id}:
    patch:
      operationId: updateEmailAccount
      tags:
        - emailaccounts
      summary: Ubah akun email
      description: Akun Google hanya display_name/status (400 bila lain); perubahan SMTP memicu re-verify → CONNECTED.
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: PATCH
        path: /api/v1/admin/email-accounts/{id}
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailAccountInput'
            example:
              display_name: Marketing Baru
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/EmailAccount'
              example:
                success: true
                message: Data berhasil diubah.
                data:
                  id: 1
                  provider: smtp
                  email_address: marketing@indobraga.com
                  display_name: Marketing Baru
                  status: connected
                  smtp_host: mail.indobraga.com
                  smtp_port: 465
                  smtp_security: ssl_tls
                  smtp_username: marketing@indobraga.com
                  last_validated_at: '2026-05-12T08:30:00.000Z'
                  connected_at: '2026-05-12T08:30:00.000Z'
                  last_error: null
                  created_at: '2026-05-12T08:30:00.000Z'
                  updated_at: '2026-05-12T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteEmailAccount
      tags:
        - emailaccounts
      summary: Hapus akun email
      description: Hard-delete; 422 bila masih dirujuk kampanye (FK Restrict).
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: DELETE
        path: /api/v1/admin/email-accounts/{id}
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/DeleteEmailAccountResult'
              example:
                success: true
                message: Data berhasil dihapus.
                data:
                  id: 1
                  status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/email-accounts/{id}/disable:
    post:
      operationId: disableEmailAccount
      tags:
        - emailaccounts
      summary: Nonaktifkan akun email
      x-module: emailaccounts
      x-permission: email_accounts.manage
      x-rate-limit: default
      x-cache-control: no-store
      x-legacy:
        method: POST
        path: /api/v1/admin/email-accounts/{id}/disable
        changes: Tidak ada perubahan bentuk data selain envelope v1.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Berhasil.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/EmailAccount'
              example:
                success: true
                message: Data berhasil diubah.
                data:
                  id: 1
                  provider: smtp
                  email_address: marketing@indobraga.com
                  display_name: Marketing
                  status: disabled
                  created_at: '2026-05-12T08:30:00.000Z'
                  updated_at: '2026-05-12T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
